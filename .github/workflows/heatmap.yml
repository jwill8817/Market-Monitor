name: Daily market heatmap

# Runs after the US close (22:30 UTC weekdays) and on demand.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "yfinance==1.4.1" pandas lxml
      - name: Build heatmap datasets
        run: python scripts/heatmap_daily.py sp500
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/heatmap_*.json
          git diff --staged --quiet || git commit -m "Daily market heatmap ($(date -u +%F))"
          git push
