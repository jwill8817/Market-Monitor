name: Daily market heatmap

# Runs after the US close (22:30 UTC weekdays) and on demand.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "yfinance==1.4.1" pandas lxml certifi
      - name: Build heatmap datasets
        run: python scripts/heatmap_daily.py sp500
      - name: Build CFTC COT positioning
        run: python scripts/cot_daily.py || true
      - name: Build global sovereign rates
        run: python scripts/global_rates_daily.py || true
      - name: Build SG Trend Indicator
        run: python scripts/sg_trend_daily.py || true
      - name: Build crowded-shorts index
        run: python scripts/crowding_index_daily.py || true
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/heatmap_*.json data/cot.json data/breadth_sp500.csv data/realized_corr_sp500.csv data/global_rates.json data/sg_trend.json data/crowding_shorts_index.json
          git diff --staged --quiet || git commit -m "Daily datasets: heatmap + breadth + COT + global rates + SG trend + crowding ($(date -u +%F))"
          git push
