name: Daily index aggregates

# Runs once a day pre-market (09:00 UTC = ~05:00 ET, after the Japan close) and on demand.
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "lseg-data==2.1.1" pandas
      - name: Compute aggregates
        env:
          LSEG_APP_KEY: ${{ secrets.LSEG_APP_KEY }}
          LSEG_USER: ${{ secrets.LSEG_USER }}
          LSEG_PASSWORD: ${{ secrets.LSEG_PASSWORD }}
        run: python scripts/index_agg_daily.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index_aggregates.csv
          git diff --staged --quiet || git commit -m "Daily index aggregates ($(date -u +%F))"
          git push
