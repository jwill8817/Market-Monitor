// ── Draw: T-Rex Final Boss ─────────────────────────────────
function drawMegalosaurus(b) {
  if (!b || b.hp<=0) return;
  const bx=b.x-cameraX, by=b.y;
  if (bx+b.w < -20 || bx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;
  ctx.save(); ctx.translate(bx+b.w/2, by+b.h/2);
  if (b.facing < 0) ctx.scale(-1,1);
  ctx.scale(2.2,2.2);
  const ox=0, oy=0;
  const stun = b.state==='stun';
  const stomp = b.state==='stomp';
  const bounce = stomp ? Math.abs(Math.sin(Date.now()/60))*4 : Math.sin(Date.now()/140)*1.5;
  const legCrunch = stomp ? 8 : 0;

  // Tail — thick and powerful
  ctx.fillStyle='#4a4a5a';
  ctx.beginPath(); ctx.moveTo(ox-24,oy+20); ctx.quadraticCurveTo(ox-50,oy+32,ox-46,oy+12);
  ctx.quadraticCurveTo(ox-38,oy+0,ox-16,oy+14); ctx.fill();

  // Body — stocky, barrel-chested
  ctx.fillStyle=stun?'#90a4ae':'#5a5a6e';
  ctx.beginPath(); ctx.ellipse(ox,oy+6,30,24,0,0,Math.PI*2); ctx.fill();
  // Belly lighter
  ctx.fillStyle=stun?'#b0bec5':'#7a7a8e';
  ctx.beginPath(); ctx.ellipse(ox+4,oy+12,18,14,0,0,Math.PI*2); ctx.fill();

  // Neck — thick
  ctx.fillStyle=stun?'#90a4ae':'#5a5a6e';
  ctx.beginPath(); ctx.moveTo(ox+8,oy-10); ctx.lineTo(ox+20,oy-26); ctx.lineTo(ox+12,oy-28); ctx.lineTo(ox+2,oy-12); ctx.fill();

  // Head — large, wide jaw (megalosaurus known for powerful jaws)
  ctx.fillStyle=stun?'#90a4ae':'#4a4a5e';
  ctx.beginPath(); ctx.ellipse(ox+24,oy-24+bounce,18,13,0.15,0,Math.PI*2); ctx.fill();

  // Lower jaw — drops dramatically during stomp
  ctx.fillStyle='#3a3a4e';
  const jawDrop = stomp ? 10 : 3;
  ctx.beginPath(); ctx.ellipse(ox+30,oy-14+bounce+jawDrop/2,12,6+jawDrop,0.1,0,Math.PI*2); ctx.fill();

  // Teeth — prominent
  ctx.fillStyle='#fffde7';
  [-4,2,8,14].forEach(tx=>{
    ctx.beginPath(); ctx.moveTo(ox+22+tx,oy-10+bounce+jawDrop);
    ctx.lineTo(ox+20+tx,oy-5+bounce+jawDrop); ctx.lineTo(ox+25+tx,oy-5+bounce+jawDrop); ctx.fill();
  });

  // Eye — glowing in the dark
  ctx.fillStyle=stun?'#90caf9':'#ff6f00';
  ctx.beginPath(); ctx.arc(ox+19,oy-27+bounce,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a0000';
  ctx.beginPath(); ctx.arc(ox+20,oy-27+bounce,2.5,0,Math.PI*2); ctx.fill();
  // Eye glow halo
  if(!stun){ ctx.save(); ctx.globalAlpha=0.3; ctx.fillStyle='#ff8f00';
    ctx.beginPath(); ctx.arc(ox+19,oy-27+bounce,9,0,Math.PI*2); ctx.fill(); ctx.restore(); }

  // Arms — stubby but clawed
  ctx.fillStyle='#5a5a6e';
  ctx.beginPath(); ctx.moveTo(ox+10,oy-2); ctx.lineTo(ox+20,oy+12); ctx.lineTo(ox+14,oy+14); ctx.lineTo(ox+4,oy+0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox-4,oy+4); ctx.lineTo(ox-12,oy+16); ctx.lineTo(ox-6,oy+18); ctx.lineTo(ox+2,oy+6); ctx.fill();

  // Claws
  ctx.fillStyle='#212121';
  [[ox+16,oy+14],[ox+20,oy+16],[ox-8,oy+18],[ox-12,oy+20]].forEach(([cx2,cy2])=>{
    ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2+5,cy2+6); ctx.lineTo(cx2+2,cy2+6); ctx.fill();
  });

  // Legs — thick, powerful stompers
  ctx.fillStyle='#4a4a5e';
  // Left leg — raises during stomp
  const leftLift = stomp ? -legCrunch : 0;
  ctx.beginPath(); ctx.moveTo(ox-12,oy+26+leftLift); ctx.lineTo(ox-18,oy+46+leftLift); ctx.lineTo(ox-6,oy+46+leftLift); ctx.lineTo(ox-2,oy+26+leftLift); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox+6,oy+26); ctx.lineTo(ox+10,oy+46); ctx.lineTo(ox+22,oy+46); ctx.lineTo(ox+16,oy+26); ctx.fill();

  // Feet — wide flat stompers
  ctx.fillStyle='#3a3a4e';
  ctx.beginPath(); ctx.ellipse(ox-12+(-legCrunch*0.3),oy+48+leftLift,12,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(ox+16,oy+48,12,5,0,0,Math.PI*2); ctx.fill();

  // Stomp dust cloud effect
  if (stomp) {
    ctx.save(); ctx.globalAlpha=0.4; ctx.fillStyle='#8d8d8d';
    ctx.beginPath(); ctx.ellipse(ox-12,oy+50,18,8,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Frustrated bubble
  if (b.frustratedBubble) {
    ctx.fillStyle='rgba(255,100,0,0.9)';
    ctx.beginPath(); ctx.arc(ox+38,oy-38+bounce,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
    ctx.fillText('😤',ox+38,oy-34+bounce);
  }

  // Speech bubble
  if (b.speechBubble && b.speechText) {
    ctx.restore(); ctx.save();
    ctx.translate(bx+b.w/2, by+b.h/2);
    if (b.facing < 0) ctx.scale(-1,1);
    ctx.font='bold 12px Comic Sans MS';
    const tw=ctx.measureText(b.speechText).width+16;
    drawRoundRect(28,-65,tw,24,6,'rgba(255,255,255,0.93)','#212121');
    ctx.fillStyle='#1a1a1a'; ctx.textAlign='left';
    ctx.fillText(b.speechText,36,-51);
  }
  ctx.restore();
}

function drawYantuanosaurus(b) {
  if (!b || b.hp<=0) return;
  const bx=b.x-cameraX, by=b.y;
  if (bx+b.w < -20 || bx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;
  ctx.save(); ctx.translate(bx+b.w/2, by+b.h/2);
  if (b.facing < 0) ctx.scale(-1,1);
  ctx.scale(2.2,2.2);
  const ox=0, oy=0;
  const stun = b.state==='stun';
  const bounce = Math.sin(Date.now()/120)*1.5;
  const rockfall = b.state==='rockfall';

  // Tail
  ctx.fillStyle='#6d4c41';
  ctx.beginPath(); ctx.moveTo(ox-28,oy+18); ctx.quadraticCurveTo(ox-52,oy+28,ox-44,oy+10); ctx.quadraticCurveTo(ox-38,oy+2,ox-18,oy+12); ctx.fill();

  // Body
  ctx.fillStyle=stun?'#b0bec5':'#8d6e63';
  ctx.beginPath(); ctx.ellipse(ox,oy+8,28,22,0,0,Math.PI*2); ctx.fill();

  // Neck
  ctx.fillStyle=stun?'#b0bec5':'#8d6e63';
  ctx.beginPath(); ctx.moveTo(ox+10,oy-8); ctx.lineTo(ox+22,oy-22); ctx.lineTo(ox+14,oy-24); ctx.lineTo(ox+4,oy-10); ctx.fill();

  // Head crest (distinctive Yantuanosaurus feature)
  ctx.fillStyle='#bf360c';
  ctx.beginPath(); ctx.moveTo(ox+20,oy-28); ctx.quadraticCurveTo(ox+28,oy-38,ox+16,oy-36); ctx.lineTo(ox+18,oy-26); ctx.fill();

  // Head
  ctx.fillStyle=stun?'#b0bec5':'#795548';
  ctx.beginPath(); ctx.ellipse(ox+24,oy-22+bounce,16,12,0.2,0,Math.PI*2); ctx.fill();

  // Jaw
  ctx.fillStyle='#6d4c41';
  const jawOpen = b.state==='intro' ? 4 : (rockfall ? 6 : 2);
  ctx.beginPath(); ctx.ellipse(ox+30,oy-14+bounce+jawOpen/2,10,5+jawOpen,0.15,0,Math.PI*2); ctx.fill();

  // Teeth
  ctx.fillStyle='#fff';
  [-3,2,7].forEach(tx=>{
    ctx.beginPath(); ctx.moveTo(ox+24+tx,oy-10+bounce+jawOpen);
    ctx.lineTo(ox+22+tx,oy-6+bounce+jawOpen); ctx.lineTo(ox+26+tx,oy-6+bounce+jawOpen); ctx.fill();
  });

  // Eye
  ctx.fillStyle=stun?'#90caf9':'#1a1a00';
  ctx.beginPath(); ctx.arc(ox+20,oy-25+bounce,4,0,Math.PI*2); ctx.fill();
  if (!stun) { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ox+21,oy-26+bounce,1.5,0,Math.PI*2); ctx.fill(); }

  // Arms
  ctx.fillStyle='#8d6e63';
  ctx.beginPath(); ctx.moveTo(ox+12,oy); ctx.lineTo(ox+22,oy+14); ctx.lineTo(ox+16,oy+16); ctx.lineTo(ox+6,oy+2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox-6,oy+4); ctx.lineTo(ox-14,oy+16); ctx.lineTo(ox-8,oy+18); ctx.lineTo(ox+0,oy+6); ctx.fill();

  // Claws
  ctx.fillStyle='#4e342e';
  [[ox+18,oy+16],[ox+22,oy+18],[ox-10,oy+18],[ox-14,oy+20]].forEach(([cx2,cy2])=>{
    ctx.beginPath(); ctx.moveTo(cx2,cy2); ctx.lineTo(cx2+4,cy2+5); ctx.lineTo(cx2+2,cy2+5); ctx.fill();
  });

  // Legs
  ctx.fillStyle='#795548';
  ctx.beginPath(); ctx.moveTo(ox-10,oy+24); ctx.lineTo(ox-16,oy+44); ctx.lineTo(ox-6,oy+44); ctx.lineTo(ox-2,oy+24); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox+8,oy+24); ctx.lineTo(ox+12,oy+44); ctx.lineTo(ox+22,oy+44); ctx.lineTo(ox+16,oy+24); ctx.fill();

  // Feet
  ctx.fillStyle='#6d4c41';
  [ox-18,ox+10].forEach(fx=>{ ctx.beginPath(); ctx.ellipse(fx+4,oy+46,8,4,0,0,Math.PI*2); ctx.fill(); });

  // Frustrated face
  if (b.frustratedBubble) {
    ctx.fillStyle='rgba(255,100,0,0.9)';
    ctx.beginPath(); ctx.arc(ox+36,oy-36+bounce,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
    ctx.fillText('😤',ox+36,oy-32+bounce);
  }

  // Speech bubble
  if (b.speechBubble && b.speechText) {
    ctx.restore(); ctx.save();
    ctx.translate(bx+b.w/2, by+b.h/2);
    if (b.facing < 0) ctx.scale(-1,1);
    ctx.font='bold 12px Comic Sans MS';
    const tw=ctx.measureText(b.speechText).width+16;
    const bx2=26, by2=-62, bh2=24;
    drawRoundRect(bx2,by2,tw,bh2,6,'rgba(255,255,255,0.93)','#546e7a');
    ctx.fillStyle='#1a1a2e'; ctx.textAlign='left';
    ctx.fillText(b.speechText,bx2+8,by2+16);
  }

  ctx.restore();
}

function drawTRex(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.55);
  ctx.scale(b.facing, 1);

  const breathe = Math.sin(Date.now()/380)*2;
  const legSwing = Math.sin(b.frame*1.4)*10;
  const tailWag  = Math.sin(b.frame*1.0)*6;
  const defeated = b.state === 'defeated';
  const roaring  = b.state === 'roar';
  ctx.scale(2.2, 2.2);

  // ── Tail ──
  ctx.beginPath();
  ctx.moveTo(-20, 18+breathe);
  ctx.bezierCurveTo(-45+tailWag,24,-70+tailWag*1.5,26,-88+tailWag*2,20);
  ctx.bezierCurveTo(-75,12,-45,12,-20,12);
  ctx.fillStyle='#558b2f'; ctx.fill();

  // ── Body ──
  ctx.beginPath(); ctx.ellipse(8,16+breathe,36,22,0,0,Math.PI*2);
  const bodyG = ctx.createRadialGradient(4,12+breathe,2,4,14+breathe,36);
  bodyG.addColorStop(0,'#8bc34a'); bodyG.addColorStop(1,'#558b2f');
  ctx.fillStyle=bodyG; ctx.fill(); ctx.strokeStyle='#33691e'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(4,22+breathe,24,14,0.1,0,Math.PI*2);
  ctx.fillStyle='#dcedc8'; ctx.fill();
  ctx.strokeStyle='rgba(51,105,30,0.4)'; ctx.lineWidth=1;
  for(let row=0;row<3;row++) for(let col=0;col<5;col++){
    ctx.beginPath(); ctx.arc(-14+col*12,6+row*10+breathe,4,0,Math.PI*2); ctx.stroke();
  }

  // ── Neck ──
  ctx.beginPath(); ctx.moveTo(24,2+breathe);
  ctx.bezierCurveTo(38,-4,46,-10,52,-18);
  ctx.bezierCurveTo(46,-8,38,0,30,12+breathe);
  ctx.fillStyle='#6c9c28'; ctx.fill();

  // ── MASSIVE Head ──
  ctx.beginPath(); ctx.ellipse(58,-22,22,18,-0.05,0,Math.PI*2);
  const headG = ctx.createRadialGradient(54,-24,2,56,-22,22);
  headG.addColorStop(0,'#8bc34a'); headG.addColorStop(1,'#558b2f');
  ctx.fillStyle=headG; ctx.fill(); ctx.strokeStyle='#33691e'; ctx.lineWidth=2.5; ctx.stroke();
  const jawOpen = roaring ? 22 : 0;
  ctx.beginPath();
  ctx.moveTo(40,-14+jawOpen*0.3); ctx.bezierCurveTo(60,-14+jawOpen*0.3,88,-18+jawOpen*0.3,100,-17+jawOpen*0.3);
  ctx.bezierCurveTo(100,-12+jawOpen*0.3,88,-11+jawOpen*0.3,60,-11+jawOpen*0.3); ctx.lineTo(40,-11+jawOpen*0.3); ctx.closePath();
  ctx.fillStyle='#6c9c28'; ctx.fill(); ctx.strokeStyle='#33691e'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(42,-11-jawOpen*0.7); ctx.bezierCurveTo(62,-10-jawOpen*0.7,88,-10-jawOpen*0.7,100,-14-jawOpen*0.7);
  ctx.bezierCurveTo(100,-8-jawOpen*0.7,88,-5-jawOpen*0.7,62,-5-jawOpen*0.7); ctx.lineTo(42,-6-jawOpen*0.7); ctx.closePath();
  ctx.fillStyle='#558b2f'; ctx.fill();
  if (roaring) {
    ctx.beginPath(); ctx.moveTo(44,-12); ctx.lineTo(98,-15); ctx.lineTo(98,-8); ctx.lineTo(44,-5); ctx.closePath();
    ctx.fillStyle='#e57373'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(60,-12); ctx.bezierCurveTo(72,-12,80,-8,72,-8); ctx.closePath();
    ctx.fillStyle='#c62828'; ctx.fill();
  }
  ctx.fillStyle='#fffde7';
  for(let i=0;i<6;i++){
    ctx.beginPath(); ctx.moveTo(44+i*9,-11+jawOpen*0.3); ctx.lineTo(46+i*9,-18+jawOpen*0.3); ctx.lineTo(49+i*9,-11+jawOpen*0.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(45+i*9,-5-jawOpen*0.7); ctx.lineTo(47+i*9,2-jawOpen*0.7); ctx.lineTo(50+i*9,-5-jawOpen*0.7); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(50,-28,8,0,Math.PI*2); ctx.fillStyle='#fff9c4'; ctx.fill();
  ctx.beginPath(); ctx.arc(50,-28,6,0,Math.PI*2); ctx.fillStyle=roaring?'#ff6f00':'#e65100'; ctx.fill();
  if (defeated){
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(46,-32); ctx.lineTo(54,-24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(54,-32); ctx.lineTo(46,-24); ctx.stroke();
    const st=Date.now()/200;
    ctx.fillStyle='rgba(255,80,80,0.7)';
    ctx.beginPath(); ctx.arc(46+Math.sin(st)*2,-46+Math.cos(st)*2,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(56+Math.sin(st+1)*2,-54+Math.cos(st+1)*2,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(50+Math.sin(st+2)*2,-60+Math.cos(st+2)*2,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(51,-28,3,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.beginPath(); ctx.arc(52,-30,1.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    if(roaring){ ctx.beginPath(); ctx.arc(50,-28,5,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fill(); }
  }
  ctx.beginPath();
  if(defeated){ ctx.moveTo(40,-36); ctx.lineTo(62,-28); }
  else        { ctx.moveTo(42,-34); ctx.lineTo(62,-38); }
  ctx.strokeStyle='#33691e'; ctx.lineWidth=3.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(95,-17,3,2,0.3,0,Math.PI*2); ctx.fillStyle='#33691e'; ctx.fill();

  // ── Tiny 2-fingered arms ──
  ctx.save(); ctx.translate(30,14+breathe); ctx.rotate(-0.5);
  ctx.beginPath(); ctx.ellipse(0,6,6,10,0,0,Math.PI*2); ctx.fillStyle='#6c9c28'; ctx.fill(); ctx.strokeStyle='#33691e'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#33691e';
  ctx.beginPath(); ctx.moveTo(-3,14); ctx.lineTo(-6,20); ctx.lineTo(0,15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3,14);  ctx.lineTo(5,20);  ctx.lineTo(8,15);  ctx.fill();
  ctx.restore();

  // ── Powerful legs ──
  ctx.save(); ctx.translate(-10,30+breathe); ctx.rotate(-legSwing*0.05);
  drawRoundRect(-8,0,20,26,7,'#558b2f','#33691e');
  ctx.beginPath(); ctx.ellipse(2,28,14,6,0,0,Math.PI*2); ctx.fillStyle='#558b2f'; ctx.fill();
  ctx.fillStyle='#33691e';
  [-10,-3,5,13].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,26);ctx.lineTo(cx-2,34);ctx.lineTo(cx+5,27);ctx.fill();});
  ctx.restore();

  ctx.save(); ctx.translate(12,30+breathe); ctx.rotate(legSwing*0.05);
  drawRoundRect(-8,0,20,26,7,'#6c9c28','#558b2f');
  ctx.beginPath(); ctx.ellipse(2,28,14,6,0,0,Math.PI*2); ctx.fillStyle='#6c9c28'; ctx.fill();
  ctx.fillStyle='#558b2f';
  [-10,-3,5,13].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,26);ctx.lineTo(cx-2,34);ctx.lineTo(cx+5,27);ctx.fill();});
  ctx.restore();

  ctx.restore(); // unscale

  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'IMPOSSIBLE! I AM KING!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 80;
    const bw = 210, bh = 46;
    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', b.frustratedBubble ? '#c62828' : '#333');
    const tailX = b.facing > 0 ? bubX - 1 : bubX + bw + 1;
    ctx.beginPath();
    ctx.moveTo(tailX,bubY+bh*0.6); ctx.lineTo(tailX+(b.facing>0?-18:18),bubY+bh*0.8); ctx.lineTo(tailX,bubY+bh*0.9);
    ctx.fillStyle='white'; ctx.fill(); ctx.strokeStyle=b.frustratedBubble?'#c62828':'#333'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=b.frustratedBubble?'#33691e':'#222';
    ctx.font=`bold ${b.frustratedBubble?15:14}px Comic Sans MS`;
    ctx.textAlign='center'; ctx.fillText(bubbleText, bubX+bw/2, bubY+bh/2+6); ctx.textAlign='left';
  }

  ctx.restore();
}

// ── Draw: Pteranodon Boss ──────────────────────────────────
function drawPteranodon(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.5);
  ctx.scale(b.facing, 1);

  const breathe  = Math.sin(Date.now()/350)*1.5;
  const flapAng  = Math.sin(b.frame*1.8)*0.35;
  const defeated = b.state === 'defeated';
  const diving   = b.state === 'dive';
  const scaleX   = 2.2;
  ctx.scale(scaleX, scaleX);

  // ── Body tilt when diving ──
  if (diving) ctx.rotate(0.4);

  // ── Left wing (back) ──
  ctx.save();
  ctx.rotate(-flapAng - (defeated ? 0.6 : 0));
  ctx.beginPath();
  ctx.moveTo(-4, 0);
  ctx.bezierCurveTo(-20, -10, -55, -18, -90, -5+breathe);
  ctx.bezierCurveTo(-70, 12, -30, 14, -4, 8);
  ctx.fillStyle='#4e342e'; ctx.fill();
  ctx.strokeStyle='#3e2723'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();

  // ── Right wing (front) ──
  ctx.save();
  ctx.rotate(flapAng + (defeated ? 0.6 : 0));
  ctx.beginPath();
  ctx.moveTo(4, 0);
  ctx.bezierCurveTo(22, -10, 58, -18, 92, -5+breathe);
  ctx.bezierCurveTo(72, 12, 32, 14, 4, 8);
  ctx.fillStyle='#5d4037'; ctx.fill();
  ctx.strokeStyle='#3e2723'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();

  // ── Body (small ellipse) ──
  ctx.beginPath();
  ctx.ellipse(0, 4+breathe, 14, 10, 0, 0, Math.PI*2);
  ctx.fillStyle='#5d4037'; ctx.fill();
  ctx.strokeStyle='#3e2723'; ctx.lineWidth=1.5; ctx.stroke();

  // ── Neck ──
  ctx.beginPath();
  ctx.moveTo(8, -2+breathe);
  ctx.bezierCurveTo(16, -8, 22, -14, 26, -20);
  ctx.bezierCurveTo(20, -12, 14, -6, 6, 4+breathe);
  ctx.fillStyle='#5d4037'; ctx.fill();

  // ── Head ──
  ctx.beginPath();
  ctx.ellipse(30, -24, 12, 8, -0.2, 0, Math.PI*2);
  ctx.fillStyle='#5d4037'; ctx.fill();
  ctx.strokeStyle='#3e2723'; ctx.lineWidth=1.5; ctx.stroke();

  // ── Head crest (long, swept back) ──
  ctx.beginPath();
  ctx.moveTo(22, -28);
  ctx.bezierCurveTo(10, -36, -4, -38, -12, -34);
  ctx.bezierCurveTo(-6, -28, 8, -28, 22, -24);
  ctx.closePath();
  ctx.fillStyle='#e64a19'; ctx.fill();
  ctx.strokeStyle='#bf360c'; ctx.lineWidth=1; ctx.stroke();

  // ── Long thin beak ──
  ctx.beginPath();
  ctx.moveTo(36, -24);
  ctx.lineTo(74, -22);
  ctx.lineTo(74, -20);
  ctx.lineTo(36, -21);
  ctx.closePath();
  ctx.fillStyle='#6d4c41'; ctx.fill();
  // Lower beak
  ctx.beginPath();
  ctx.moveTo(36, -21);
  ctx.lineTo(74, -20);
  ctx.lineTo(74, -19);
  ctx.lineTo(36, -20);
  ctx.closePath();
  ctx.fillStyle='#4e342e'; ctx.fill();

  // ── Eye ──
  ctx.beginPath(); ctx.arc(26, -26, 4, 0, Math.PI*2); ctx.fillStyle='#fff9e6'; ctx.fill();
  ctx.beginPath(); ctx.arc(26, -26, 3, 0, Math.PI*2); ctx.fillStyle='#4a148c'; ctx.fill();
  if (defeated) {
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(23,-29); ctx.lineTo(29,-23); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(29,-29); ctx.lineTo(23,-23); ctx.stroke();
    const st=Date.now()/200;
    ctx.fillStyle='rgba(150,80,255,0.7)';
    ctx.beginPath(); ctx.arc(24+Math.sin(st)*2,-40+Math.cos(st)*2,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(32+Math.sin(st+1)*2,-46+Math.cos(st+1)*2,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(27,-26,1.5,0,Math.PI*2); ctx.fillStyle='#212121'; ctx.fill();
    ctx.beginPath(); ctx.arc(27,-27,0.8,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  ctx.beginPath();
  if(defeated){ ctx.moveTo(20,-32); ctx.lineTo(34,-26); }
  else        { ctx.moveTo(20,-30); ctx.lineTo(34,-33); }
  ctx.strokeStyle='#3e2723'; ctx.lineWidth=2; ctx.stroke();

  // ── Small feet/talons ──
  ctx.fillStyle='#4e342e';
  [[-6,12],[4,12]].forEach(([fx,fy])=>{
    ctx.beginPath(); ctx.ellipse(fx,fy+breathe,3,6,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx-4,fy+breathe+5); ctx.lineTo(fx-8,fy+breathe+10); ctx.lineWidth=2; ctx.strokeStyle='#3e2723'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,fy+breathe+6);   ctx.lineTo(fx,fy+breathe+12);   ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+4,fy+breathe+5); ctx.lineTo(fx+8,fy+breathe+10); ctx.stroke();
  });

  ctx.restore(); // unscale

  // ── Speech bubble (screen space) ──
  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'SCREEEE!! NOT FAIR!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 55;

// ── Draw: Ceratosaurus Boss ────────────────────────────────
function drawCeratosaurus(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.55);
  ctx.scale(b.facing, 1);

  const breathe   = Math.sin(Date.now()/400)*1.5;
  const legSwing  = Math.sin(b.frame*1.6)*9;
  const tailWag   = Math.sin(b.frame*1.2)*5;
  const defeated  = b.state === 'defeated';
  const spitting  = b.state === 'toxicspit';

  ctx.scale(2.2, 2.2);

  // ── Tail (long, with stripe segments) ──
  ctx.beginPath();
  ctx.moveTo(-18, 20+breathe);
  ctx.bezierCurveTo(-44+tailWag, 26, -70+tailWag*1.5, 30, -88+tailWag*2, 24);
  ctx.bezierCurveTo(-74, 14, -46, 13, -18, 12);
  ctx.fillStyle='#2e4a00'; ctx.fill();
  // Yellow-green stripe segments on tail
  ctx.fillStyle='#7dab00';
  [[-30,18,10,5],[-50,20,10,5],[-68,22,9,4]].forEach(([tx,ty,tw,th])=>{
    ctx.beginPath(); ctx.ellipse(tx+tailWag*0.5, ty+breathe, tw/2, th/2, 0, 0, Math.PI*2); ctx.fill();
  });

  // ── Body ──
  ctx.beginPath(); ctx.ellipse(6, 16+breathe, 30, 20, 0, 0, Math.PI*2);
  ctx.fillStyle='#2e4a00'; ctx.fill(); ctx.strokeStyle='#1a2e00'; ctx.lineWidth=2; ctx.stroke();
  // Belly patch
  ctx.beginPath(); ctx.ellipse(4, 22+breathe, 18, 13, 0.1, 0, Math.PI*2);
  ctx.fillStyle='#e8d87a'; ctx.fill();
  // Stripe accents on body
  ctx.strokeStyle='#7dab00'; ctx.lineWidth=1.5;
  [-8,2,12].forEach(rx=>{
    ctx.beginPath(); ctx.moveTo(rx, 5+breathe); ctx.lineTo(rx-3, 28+breathe); ctx.stroke();
  });

  // ── Neck ──
  ctx.beginPath(); ctx.moveTo(22, 4+breathe);
  ctx.bezierCurveTo(34, -2, 40, -6, 44, -10);
  ctx.bezierCurveTo(40, -3, 34, 2, 26, 12+breathe);
  ctx.fillStyle='#2e4a00'; ctx.fill();

  // ── Head (wider, shorter snout than Allo) ──
  ctx.beginPath(); ctx.ellipse(50, -18, 18, 14, -0.05, 0, Math.PI*2);
  ctx.fillStyle='#2e4a00'; ctx.fill(); ctx.strokeStyle='#1a2e00'; ctx.lineWidth=2; ctx.stroke();
  // Upper jaw / snout
  ctx.beginPath();
  ctx.moveTo(36, -14); ctx.bezierCurveTo(52, -14, 72, -16, 82, -15);
  ctx.bezierCurveTo(82, -10, 70, -9, 50, -9); ctx.lineTo(36, -9); ctx.closePath();
  ctx.fillStyle='#3a5c00'; ctx.fill(); ctx.strokeStyle='#1a2e00'; ctx.lineWidth=1.5; ctx.stroke();
  // Lower jaw
  ctx.beginPath();
  ctx.moveTo(38, -9); ctx.bezierCurveTo(56, -8, 74, -8, 82, -12);
  ctx.bezierCurveTo(82, -5, 70, -3, 52, -3); ctx.lineTo(38, -4); ctx.closePath();
  ctx.fillStyle='#2e4a00'; ctx.fill();
  // Teeth
  ctx.fillStyle='#fffff0';
  for(let i=0;i<4;i++){
    ctx.beginPath(); ctx.moveTo(44+i*9,-9); ctx.lineTo(46+i*9,-14); ctx.lineTo(49+i*9,-9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(45+i*9,-4); ctx.lineTo(47+i*9,1);  ctx.lineTo(50+i*9,-4); ctx.fill();
  }
  // Toxic spit drip from lower jaw tip
  if (spitting) {
    ctx.fillStyle='rgba(57,255,20,0.85)';
    ctx.beginPath(); ctx.arc(80, -1, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(78,4); ctx.lineTo(82,4); ctx.lineTo(80,14); ctx.closePath(); ctx.fill();
  }

  // ── THREE HORNS ──
  // 1) Large nasal horn — rises from snout tip, pointing up-forward
  ctx.fillStyle='#e8d87a'; ctx.strokeStyle='#1a2e00'; ctx.lineWidth=1.2;

  ctx.moveTo(76, -16);
  ctx.lineTo(72, -32);
  ctx.lineTo(68, -16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 2) Left brow horn (small rounded bump above left eye socket)
  ctx.beginPath(); ctx.ellipse(44, -30, 4, 5, -0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  ctx.beginPath(); ctx.ellipse(56, -30, 4, 5, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  if (defeated) {

    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-4,-12); ctx.lineTo(-8,0); ctx.closePath();
    ctx.fillStyle='#c4b560'; ctx.fill();
    ctx.restore();

// ── Draw: Cryolophosaurus Boss ─────────────────────────────
function drawCryolophosaurus(b) {
  if (!b || b.hp<=0) return;

  ctx.save();

  ctx.scale(b.facing, 1);

  const breathe  = Math.sin(Date.now()/400)*1.5;
  const legSwing = Math.sin(b.frame*1.6)*9;
  const tailWag  = Math.sin(b.frame*1.2)*5;
  const defeated = b.state === 'defeated';
  const kicking  = b.state === 'kick';
  const kickPhase = kicking ? Math.max(0, Math.min(1, (40 - b.stateTimer) / 20)) : 0;
  const kickLegAngle = kickPhase * 1.8 - 0.2;

  ctx.scale(2.2, 2.2);

  // ── Tail ──
  ctx.beginPath();

  ctx.bezierCurveTo(-42+tailWag, 26, -64+tailWag*1.5, 28, -80+tailWag*2, 22);

  ctx.fillStyle='#455a64'; ctx.fill(); ctx.strokeStyle='#263238'; ctx.lineWidth=2; ctx.stroke();
  // Upper jaw (medium snout, between Allo and T-Rex)

  ctx.moveTo(38,-14); ctx.bezierCurveTo(54,-14,74,-15,86,-14);

  ];

    ctx.moveTo(ox-5, 0);
    ctx.lineTo(ox, -ht);
    ctx.lineTo(ox+5, 0);
    ctx.closePath();
    ctx.fillStyle='#40c4ff'; ctx.fill();
    ctx.strokeStyle='#0d47a1'; ctx.lineWidth=1.2; ctx.stroke();

  // ── Brow ──

  ctx.save(); ctx.translate(0,18); ctx.rotate(0.3);
  ctx.beginPath(); ctx.ellipse(0,5,5,10,0,0,Math.PI*2);
  ctx.fillStyle='#546e7a'; ctx.fill(); ctx.strokeStyle='#263238'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#263238'; ctx.strokeStyle='#1a2025'; ctx.lineWidth=1;
  [[-5,9,-0.3],[0,10,0],[5,9,0.3]].forEach(([cx,cy,cr])=>{
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(cr);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-3,9); ctx.lineTo(3,9); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  });
  ctx.restore();
  ctx.restore();

  // ── Two legs — front uses kickLegAngle when kicking ──
  // Back leg (normal legSwing)
  ctx.save(); ctx.translate(-8,28+breathe); ctx.rotate(-legSwing*0.05);

  [-8,-2,5,11].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,22);ctx.lineTo(cx-2,29);ctx.lineTo(cx+4,23);ctx.fill();});

  drawRoundRect(-6,0,16,22,6,'#455a64','#263238');
  ctx.beginPath(); ctx.ellipse(2,24,12,5,0,0,Math.PI*2); ctx.fillStyle='#455a64'; ctx.fill();

  ctx.restore(); // unscale

  // ── Speech bubble ──

  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 65;
    const bw = 200, bh = 46;

// ── Draw: Dimorphodon Boss ─────────────────────────────────
function drawDimorphodon(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.5);
  ctx.scale(b.facing, 1);

  const breathe  = Math.sin(Date.now()/350)*1.2;
  const flapAng  = Math.sin(b.frame*2.0)*0.3;
  const defeated = b.state === 'defeated';
  const diving   = b.state === 'dive';
  ctx.scale(2.2, 2.2);

  if (diving) ctx.rotate(0.45);

  // ── Long thin tail with diamond tip ──
  ctx.beginPath();
  ctx.moveTo(-8, 4+breathe);
  ctx.bezierCurveTo(-24, 6, -46, 8, -60, 6+breathe);
  ctx.bezierCurveTo(-48, 12, -26, 12, -8, 10);
  ctx.fillStyle='#5d1c1c'; ctx.fill();
  // Diamond tip
  ctx.beginPath();
  ctx.moveTo(-62, 6+breathe);
  ctx.lineTo(-70, 2+breathe); ctx.lineTo(-68, 6+breathe);
  ctx.lineTo(-70, 10+breathe); ctx.closePath();
  ctx.fillStyle='#3a0a0a'; ctx.fill();

  // ── Left wing ──
  ctx.save();
  ctx.rotate(-flapAng - (defeated ? 0.7 : 0));
  ctx.beginPath();
  ctx.moveTo(-3, 0);
  ctx.bezierCurveTo(-14, -8, -44, -14, -70, -4+breathe);
  ctx.bezierCurveTo(-54, 10, -24, 12, -3, 6);
  ctx.fillStyle='#5d1c1c'; ctx.fill();
  ctx.strokeStyle='#3a0a0a'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();

  // ── Right wing ──
  ctx.save();
  ctx.rotate(flapAng + (defeated ? 0.7 : 0));
  ctx.beginPath();
  ctx.moveTo(3, 0);
  ctx.bezierCurveTo(16, -8, 46, -14, 72, -4+breathe);
  ctx.bezierCurveTo(56, 10, 26, 12, 3, 6);
  ctx.fillStyle='#6d2020'; ctx.fill();
  ctx.strokeStyle='#3a0a0a'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();

  // ── Compact body ──
  ctx.beginPath();
  ctx.ellipse(0, 4+breathe, 10, 7, 0, 0, Math.PI*2);
  ctx.fillStyle='#5d1c1c'; ctx.fill();
  ctx.strokeStyle='#3a0a0a'; ctx.lineWidth=1.5; ctx.stroke();

  // ── Neck ──
  ctx.beginPath();
  ctx.moveTo(6, -1+breathe);
  ctx.bezierCurveTo(12, -5, 16, -10, 18, -14);
  ctx.bezierCurveTo(14, -8, 10, -3, 4, 3+breathe);
  ctx.fillStyle='#5d1c1c'; ctx.fill();

  // ── LARGE HEAD (disproportionately big) ──
  ctx.beginPath();
  ctx.ellipse(22, -18, 13, 10, -0.15, 0, Math.PI*2);
  ctx.fillStyle='#c62828'; ctx.fill();
  ctx.strokeStyle='#8b0000'; ctx.lineWidth=1.5; ctx.stroke();

  // Long upper jaw
  ctx.beginPath();
  ctx.moveTo(14, -14); ctx.bezierCurveTo(24, -14, 44, -16, 52, -15);
  ctx.bezierCurveTo(52, -11, 44, -10, 24, -10); ctx.lineTo(14, -10); ctx.closePath();
  ctx.fillStyle='#d32f2f'; ctx.fill(); ctx.strokeStyle='#8b0000'; ctx.lineWidth=1.2; ctx.stroke();
  // Lower jaw
  ctx.beginPath();
  ctx.moveTo(15, -10); ctx.bezierCurveTo(26, -9, 44, -9, 52, -13);
  ctx.bezierCurveTo(52, -7, 42, -6, 24, -6); ctx.lineTo(15, -7); ctx.closePath();
  ctx.fillStyle='#c62828'; ctx.fill();
  // Long front teeth + small back teeth
  ctx.fillStyle='#fffff0';
  // 2 long front teeth
  ctx.beginPath(); ctx.moveTo(18,-10); ctx.lineTo(19,-16); ctx.lineTo(21,-10); ctx.fill();
  ctx.beginPath(); ctx.moveTo(22,-10); ctx.lineTo(23,-15); ctx.lineTo(25,-10); ctx.fill();
  // smaller back teeth
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.moveTo(28+i*6,-10); ctx.lineTo(29+i*6,-13); ctx.lineTo(31+i*6,-10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(19+i*6,-7); ctx.lineTo(20+i*6,-4); ctx.lineTo(22+i*6,-7); ctx.fill();
  }

  // ── Eye (large, yellow) ──
  ctx.beginPath(); ctx.arc(18, -21, 5, 0, Math.PI*2); ctx.fillStyle='#fff9e6'; ctx.fill();
  ctx.beginPath(); ctx.arc(18, -21, 3.5, 0, Math.PI*2); ctx.fillStyle='#ffeb3b'; ctx.fill();
  if (defeated) {
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(15,-24); ctx.lineTo(21,-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(21,-24); ctx.lineTo(15,-18); ctx.stroke();
    const st=Date.now()/200;
    ctx.fillStyle='rgba(255,100,50,0.7)';
    ctx.beginPath(); ctx.arc(16+Math.sin(st)*2,-34+Math.cos(st)*2,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(24+Math.sin(st+1)*2,-40+Math.cos(st+1)*2,3,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(19,-21,2,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.beginPath(); ctx.arc(20,-22,1,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  ctx.beginPath();
  if(defeated){ ctx.moveTo(12,-27); ctx.lineTo(26,-21); }
  else        { ctx.moveTo(12,-25); ctx.lineTo(26,-28); }
  ctx.strokeStyle='#8b0000'; ctx.lineWidth=2; ctx.stroke();

  // ── Small legs/claws dangling ──
  ctx.fillStyle='#5d1c1c';
  [[-4, 8],[2, 8]].forEach(([fx,fy])=>{
    ctx.beginPath(); ctx.ellipse(fx, fy+breathe, 2.5, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a0a0a';
    ctx.beginPath(); ctx.moveTo(fx-3,fy+breathe+4); ctx.lineTo(fx-5,fy+breathe+8); ctx.lineWidth=1.5; ctx.strokeStyle='#3a0a0a'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx,fy+breathe+5); ctx.lineTo(fx,fy+breathe+9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx+3,fy+breathe+4); ctx.lineTo(fx+5,fy+breathe+8); ctx.stroke();
    ctx.fillStyle='#5d1c1c';
  });

  ctx.restore(); // unscale

  // ── Speech bubble ──
  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'SCREECH!! NOT FAIR!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 55;
    const bw = 200, bh = 46;
    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', b.frustratedBubble ? '#c62828' : '#333');
    const tailX = b.facing > 0 ? bubX - 1 : bubX + bw + 1;
    ctx.beginPath();
    ctx.moveTo(tailX,bubY+bh*0.6); ctx.lineTo(tailX+(b.facing>0?-18:18),bubY+bh*0.8); ctx.lineTo(tailX,bubY+bh*0.9);
    ctx.fillStyle='white'; ctx.fill(); ctx.strokeStyle=b.frustratedBubble?'#c62828':'#333'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=b.frustratedBubble?'#c62828':'#222';
    ctx.font=`bold ${b.frustratedBubble?15:14}px Comic Sans MS`;
    ctx.textAlign='center'; ctx.fillText(bubbleText, bubX+bw/2, bubY+bh/2+6); ctx.textAlign='left';
  }

  ctx.restore();
}

}

// ── Draw: Kronosaurus Boss ─────────────────────────────────
function drawKronosaurus(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.5);
  ctx.scale(b.facing, 1);

  const breathe = Math.sin(Date.now()/350)*2;
  const defeated = b.state === 'defeated';
  const lunging  = b.state === 'lunge';
  ctx.scale(2.2, 2.2);

  // ── Short tail ──
  ctx.beginPath();
  ctx.moveTo(-28,8+breathe);
  ctx.bezierCurveTo(-48,10,-62,8,-72,4+breathe);
  ctx.bezierCurveTo(-62,16,-46,18,-28,16+breathe);
  ctx.fillStyle='#0a1228'; ctx.fill();

  // ── Barrel body ──
  ctx.beginPath(); ctx.ellipse(0,10+breathe,36,22,0,0,Math.PI*2);
  ctx.fillStyle='#0d1b3e'; ctx.fill(); ctx.strokeStyle='#060e20'; ctx.lineWidth=2.5; ctx.stroke();
  // Lighter underbelly
  ctx.beginPath(); ctx.ellipse(0,16+breathe,24,14,0.1,0,Math.PI*2);
  ctx.fillStyle='#1a3a6e'; ctx.fill();
  // Bioluminescent spots on sides
  ctx.fillStyle='#00e5ff';
  [-20,-10,0,10,20].forEach((ox,i)=>{
    ctx.save(); ctx.globalAlpha=0.55+Math.sin(Date.now()/800+i)*0.25;
    ctx.beginPath(); ctx.arc(ox, 6+breathe+i%3*4, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // ── 4 large paddle flippers ──
  // Front flippers
  [[18,14+breathe,0.25],[-18,14+breathe,-0.25]].forEach(([fx,fy,rot])=>{
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0,10,8,18,0,0,Math.PI*2);
    ctx.fillStyle='#0a1228'; ctx.fill(); ctx.strokeStyle='#060e20'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  });
  // Rear flippers
  [[-22,20+breathe,0.2],[18,20+breathe,-0.2]].forEach(([fx,fy,rot])=>{
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(rot);
    ctx.beginPath(); ctx.ellipse(0,8,7,14,0,0,Math.PI*2);
    ctx.fillStyle='#0d1b3e'; ctx.fill();
    ctx.restore();
  });

  // ── Short neck ──
  ctx.beginPath();
  ctx.moveTo(28,0+breathe); ctx.bezierCurveTo(42,-6,52,-12,60,-20);
  ctx.bezierCurveTo(54,-10,44,-2,34,10+breathe);
  ctx.fillStyle='#0d1b3e'; ctx.fill();

  // ── MASSIVE HEAD (40% of body) — with lunge pitch ──
  if (lunging) ctx.rotate(0.25);
  ctx.beginPath(); ctx.ellipse(72,-24,26,18,-0.05,0,Math.PI*2);
  ctx.fillStyle='#0d1b3e'; ctx.fill(); ctx.strokeStyle='#060e20'; ctx.lineWidth=2.5; ctx.stroke();
  // Upper jaw (conical fish-catcher)
  const jawOpen2 = lunging ? 18 : 0;
  ctx.beginPath();
  ctx.moveTo(52,-18+jawOpen2*0.3); ctx.bezierCurveTo(76,-18+jawOpen2*0.3,106,-20+jawOpen2*0.3,118,-19+jawOpen2*0.3);
  ctx.bezierCurveTo(118,-14+jawOpen2*0.3,106,-13+jawOpen2*0.3,76,-13+jawOpen2*0.3); ctx.lineTo(52,-13+jawOpen2*0.3); ctx.closePath();
  ctx.fillStyle='#152244'; ctx.fill(); ctx.strokeStyle='#060e20'; ctx.lineWidth=1.5; ctx.stroke();
  // Lower jaw
  ctx.beginPath();
  ctx.moveTo(54,-13-jawOpen2*0.7); ctx.bezierCurveTo(78,-12-jawOpen2*0.7,106,-12-jawOpen2*0.7,118,-16-jawOpen2*0.7);
  ctx.bezierCurveTo(118,-8-jawOpen2*0.7,106,-7-jawOpen2*0.7,78,-7-jawOpen2*0.7); ctx.lineTo(54,-8-jawOpen2*0.7); ctx.closePath();
  ctx.fillStyle='#0d1b3e'; ctx.fill();
  // Many conical teeth
  ctx.fillStyle='#e8eaf6';
  for(let i=0;i<7;i++){
    ctx.beginPath(); ctx.moveTo(58+i*8,-13+jawOpen2*0.3); ctx.lineTo(60+i*8,-19+jawOpen2*0.3); ctx.lineTo(63+i*8,-13+jawOpen2*0.3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(59+i*8,-8-jawOpen2*0.7); ctx.lineTo(61+i*8,-2-jawOpen2*0.7); ctx.lineTo(64+i*8,-8-jawOpen2*0.7); ctx.fill();
  }
  // Eye
  ctx.beginPath(); ctx.arc(62,-30,7,0,Math.PI*2); ctx.fillStyle='#e0f7fa'; ctx.fill();
  ctx.beginPath(); ctx.arc(62,-30,5,0,Math.PI*2); ctx.fillStyle='#006064'; ctx.fill();
  if (defeated) {
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(59,-33); ctx.lineTo(65,-27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(65,-33); ctx.lineTo(59,-27); ctx.stroke();
    const st=Date.now()/200;
    ctx.fillStyle='rgba(0,150,200,0.7)';
    ctx.beginPath(); ctx.arc(58+Math.sin(st)*2,-44+Math.cos(st)*2,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(66+Math.sin(st+1)*2,-50+Math.cos(st+1)*2,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(63,-30,2.5,0,Math.PI*2); ctx.fillStyle='#212121'; ctx.fill();
    ctx.beginPath(); ctx.arc(64,-32,1.2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  ctx.beginPath();
  if(defeated){ ctx.moveTo(52,-38); ctx.lineTo(72,-30); }
  else        { ctx.moveTo(54,-36); ctx.lineTo(72,-40); }
  ctx.strokeStyle='#060e20'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(114,-19,2.5,1.5,0.3,0,Math.PI*2); ctx.fillStyle='#060e20'; ctx.fill();

  ctx.restore(); // unscale

  // ── Speech bubble ──
  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'THE DEEP IS MINE!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 65;
    const bw = 200, bh = 46;
    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', b.frustratedBubble ? '#0d47a1' : '#333');
    const tailX = b.facing > 0 ? bubX - 1 : bubX + bw + 1;
    ctx.beginPath();
    ctx.moveTo(tailX,bubY+bh*0.6); ctx.lineTo(tailX+(b.facing>0?-18:18),bubY+bh*0.8); ctx.lineTo(tailX,bubY+bh*0.9);
    ctx.fillStyle='white'; ctx.fill(); ctx.strokeStyle=b.frustratedBubble?'#0d47a1':'#333'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=b.frustratedBubble?'#0d47a1':'#222';
    ctx.font=`bold 14px Comic Sans MS`;
    ctx.textAlign='center'; ctx.fillText(bubbleText, bubX+bw/2, bubY+bh/2+6); ctx.textAlign='left';
  }

  ctx.restore();
}

// ── Draw: Giganotosaurus Boss ──────────────────────────────

  ctx.fillStyle='#f5deb3'; ctx.fill();

  ctx.bezierCurveTo(110,-6,96,-5,66,-5); ctx.lineTo(46,-6); ctx.closePath();
  ctx.fillStyle='#a0785a'; ctx.fill();
  // Knife-like teeth
  ctx.fillStyle='#fffde7';
  for(let i=0;i<6;i++){
    ctx.beginPath(); ctx.moveTo(50+i*9,-11); ctx.lineTo(52+i*9,-17); ctx.lineTo(55+i*9,-11); ctx.fill();
    ctx.beginPath(); ctx.moveTo(51+i*9,-6); ctx.lineTo(53+i*9,0);   ctx.lineTo(56+i*9,-6);  ctx.fill();
  }
  // Eye
  ctx.beginPath(); ctx.arc(52,-26,7,0,Math.PI*2); ctx.fillStyle='#fff9e6'; ctx.fill();

    const st=Date.now()/200;

    ctx.beginPath(); ctx.arc(52+Math.sin(st+2)*2,-58+Math.cos(st+2)*2,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(53,-26,3,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.beginPath(); ctx.arc(54,-28,1.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();

  else        { ctx.moveTo(44,-32); ctx.lineTo(64,-36); }

    ctx.fill(); ctx.stroke();

  ctx.restore(); ctx.restore();

  [-9,-2,6,13].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,24);ctx.lineTo(cx-2,32);ctx.lineTo(cx+5,25);ctx.fill();});
  ctx.restore();

  ctx.restore(); // unscale

  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'THE BIGGEST FALLS?! NOOO!!' : null;
