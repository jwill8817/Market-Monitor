<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iggy's Egg Adventure!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh;
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
    overflow: hidden;
  }
  #hud {
    display: flex; gap: 36px; align-items: center;
    margin-bottom: 8px; font-size: 21px; font-weight: bold;
    color: #fff; text-shadow: 2px 2px 0 #3a7a3a, -1px -1px 0 #3a7a3a;
  }
  canvas { border: 4px solid #4a9e4a; border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: block; }
  #message {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    background: rgba(255,230,100,0.97);
    border: 5px solid #e8a000; border-radius: 20px;
    padding: 28px 48px; text-align: center;
    font-size: 26px; color: #7a3800; z-index: 10;
    display: none; box-shadow: 0 6px 24px rgba(0,0,0,0.3);
  }
  #message h2 { font-size: 38px; margin-bottom: 10px; }
  #message button {
    margin-top: 16px; padding: 12px 34px; font-size: 21px;
    font-family: inherit; background: #4caf50; color: white;
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 0 #2e7d32; transition: transform 0.1s;
  }
  #message button:active { transform: translateY(2px); box-shadow: 0 2px 0 #2e7d32; }
  #controls-hint { margin-top: 8px; font-size: 14px; color: #fff;
    text-shadow: 1px 1px 0 #3a7a3a; opacity: 0.85; }

  /* ── Pause / Home buttons ── */
  #btn-pause, #btn-home {
    position: absolute; top: 10px;
    font-size: 28px; background: rgba(0,0,0,0.45); color: white;
    border: none; border-radius: 8px; padding: 6px 12px;
    cursor: pointer; z-index: 20; pointer-events: all;
  }
  #btn-pause { right: 10px; }
  #btn-home  { right: 68px; }

  /* ── Menu confirm overlay ── */
  #menu-confirm {
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(20,20,40,0.96); border: 3px solid #ffd700;
    border-radius: 16px; padding: 24px 36px; text-align: center;
    color: white; z-index: 30; font-size: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #menu-confirm p { margin-bottom: 16px; font-size: 22px; }
  #menu-confirm button {
    margin: 0 8px; padding: 10px 24px; font-size: 17px;
    font-family: inherit; border: none; border-radius: 10px;
    cursor: pointer;
  }
  #confirm-yes { background: #f44336; color: white; box-shadow: 0 3px 0 #b71c1c; }
  #confirm-no  { background: #4caf50; color: white; box-shadow: 0 3px 0 #2e7d32; }

  /* ── On-screen touch buttons ── */
  #touch-controls {
    display: none;  /* shown only on touch devices */
    position: absolute;
    bottom: 12px; left: 0; right: 0;
    pointer-events: none;
  }
  .btn-left, .btn-right, .btn-jump {
    position: absolute;
    bottom: 0;
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 32px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: all;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: pointer;
    transition: background 0.1s;
  }
  .btn-left:active,  .btn-left.pressed  { background: rgba(255,255,255,0.35); }
  .btn-right:active, .btn-right.pressed { background: rgba(255,255,255,0.35); }
  .btn-jump:active,  .btn-jump.pressed  { background: rgba(255,200,0,0.45); }
  .btn-left  { left: 16px; }
  .btn-right { left: 110px; }
  .btn-jump  {
    right: 16px;
    width: 90px; height: 90px;
    font-size: 36px;
    background: rgba(76,175,80,0.35);
    border-color: rgba(255,255,255,0.7);
  }

  #level-select {
    display: none;
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88);
    z-index: 15; overflow-y: auto;
    padding: 16px 10px 20px;
    box-sizing: border-box;
  }
  #level-select h2 {
    color: #ffd700; text-align: center; font-size: 26px;
    margin-bottom: 14px; text-shadow: 2px 2px 0 #7a3800;
  }
  .lvl-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; max-width: 720px; margin: 0 auto;
  }
  .lvl-btn {
    background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 10px; color: white; padding: 8px 4px;
    font-family: inherit; font-size: 13px; cursor: pointer;
    text-align: center; transition: background 0.15s;
    line-height: 1.4;
  }
  .lvl-btn:hover, .lvl-btn:active { background: rgba(255,215,0,0.25); border-color: #ffd700; }
  .lvl-btn .lvl-num { font-size: 11px; opacity: 0.7; display: block; }
  #lvl-select-close {
    display: block; margin: 14px auto 0;
    padding: 8px 28px; font-size: 16px; font-family: inherit;
    background: #f44336; color: white; border: none; border-radius: 10px;
    cursor: pointer; box-shadow: 0 3px 0 #b71c1c;
  }
</style>
</head>
<body>
<div id="hud">
  <span>🦖 Iggy's Egg Adventure!</span>
  <span>🥚 <span id="score">0</span></span>
  <span>❤️ <span id="lives">3</span></span>
  <span>🏆 Level <span id="level">1</span></span>
</div>
<div style="position:relative;">
  <canvas id="game" width="800" height="480"></canvas>
  <div id="message">
    <h2 id="msg-title">🦖 Iggy's Egg Adventure!</h2>
    <div id="msg-body"></div>
    <button id="msg-btn">Let's Go! 🦖</button>
    <button id="easy-btn" style="display:none; margin-top:10px; padding:10px 28px; font-size:18px; font-family:inherit; background:#ff9800; color:white; border:none; border-radius:12px; cursor:pointer; box-shadow:0 4px 0 #e65100;">⭐ Easy Mode (no damage)</button>
    <button id="lvl-select-btn" style="display:none; margin-top:10px; padding:10px 28px; font-size:18px; font-family:inherit; background:#1565c0; color:white; border:none; border-radius:12px; cursor:pointer; box-shadow:0 4px 0 #0d47a1;">🗺️ Level Select</button>
  </div>
  <div id="level-select">
    <h2>🗺️ Choose Your Level</h2>
    <div class="lvl-grid" id="lvl-grid"></div>
    <button id="lvl-select-close">✕ Back</button>
  </div>
  <button id="btn-pause">⏸</button>
  <button id="btn-home">🏠</button>
  <div id="menu-confirm">
    <p>🏠 Return to Main Menu?</p>
    <button id="confirm-yes">Yes, quit</button>
    <button id="confirm-no">Keep playing</button>
  </div>
  <div id="touch-controls">
    <div class="btn-left"  id="btn-left">◀</div>
    <div class="btn-right" id="btn-right">▶</div>
    <div class="btn-jump"  id="btn-jump">▲</div>
  </div>
</div>
<div id="controls-hint">Arrow Keys / WASD to move &bull; Space or ↑ to jump</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const WORLD_W = 2400;
const GRAVITY = 0.55, JUMP_FORCE = -13.5, SPEED = 4;

// ── State ──────────────────────────────────────────────────
let state = 'menu';
let easyMode = false;
let score = 0, lives = 3, level = 1;
let eggs = [], platforms = [], enemies = [], particles = [];
let boss = null, bossProjectiles = [], bossShockwaves = [];
let keys = {}, cameraX = 0;
let lastTime = 0;
let paused = false;

// ── Player ─────────────────────────────────────────────────
let player = {};
function resetPlayer() {
  player = { x:80, y:300, w:48, h:52, vx:0, vy:0, onGround:false,
             facing:1, frame:0, frameTimer:0, invincible:0 };
}

// ── Touch ──────────────────────────────────────────────────
let touchLeft=false, touchRight=false, touchJump=false;

// Show on-screen buttons on touch devices, hide keyboard hint
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('touch-controls').style.display = 'block';
  document.getElementById('controls-hint').style.display = 'none';
}

// Wire up the on-screen buttons
function bindBtn(id, onDown, onUp) {
  const el = document.getElementById(id);
  const down = e => { e.preventDefault(); onDown(); el.classList.add('pressed'); };
  const up   = e => { e.preventDefault(); onUp();   el.classList.remove('pressed'); };
  el.addEventListener('touchstart',  down, {passive:false});
  el.addEventListener('touchend',    up,   {passive:false});
  el.addEventListener('touchcancel', up,   {passive:false});
}
bindBtn('btn-left',  () => { touchLeft=true; },  () => { touchLeft=false; });
bindBtn('btn-right', () => { touchRight=true; }, () => { touchRight=false; });
bindBtn('btn-jump',  () => { touchJump=true; },  () => { touchJump=false; });
document.getElementById('btn-pause').addEventListener('touchstart', e => {
  e.preventDefault(); if (state==='playing') paused=!paused;
}, {passive:false});
document.getElementById('btn-pause').addEventListener('click', () => {
  if (state==='playing') paused=!paused;
});

function showMenuConfirm() {
  if (state !== 'playing') return;
  paused = true;
  document.getElementById('menu-confirm').style.display = 'block';
}
function hideMenuConfirm() {
  document.getElementById('menu-confirm').style.display = 'none';
}
function goToMenu() {
  hideMenuConfirm();
  paused = false;
  state = 'menu';
  boss = null; bossProjectiles = []; bossShockwaves = [];
  eggs = []; platforms = []; enemies = []; particles = [];
  showMessage('🦖 Iggy\'s Egg Adventure!',
    'Help Iggy the orange velociraptor collect all the eggs!\n\n' +
    '⬅️ ➡️ Arrow Keys to run  •  ⬆️ SPACE to jump\n' +
    '🥚 Collect eggs  •  👹 Stomp red dinos\n' +
    '⚠️ Defeat 19 bosses across 20 levels!\n\n' +
    '🟢 <b>Normal</b> — full challenge, 3 lives\n' +
    '⭐ <b>Easy Mode</b> — no damage, just fun!',
    'Normal Mode 🦖', true, true);
}

document.getElementById('btn-home').addEventListener('click', showMenuConfirm);
document.getElementById('btn-home').addEventListener('touchstart', e => {
  e.preventDefault(); showMenuConfirm();
}, {passive:false});
document.getElementById('confirm-yes').addEventListener('click', goToMenu);
document.getElementById('confirm-no').addEventListener('click', () => {
  hideMenuConfirm(); paused = false;
});

function handleTouch(e) {
  e.preventDefault(); touchLeft=touchRight=touchJump=false;
  for (const t of e.touches) {
    const r = canvas.getBoundingClientRect();
    const tx = (t.clientX-r.left)/(r.width/W), ty = (t.clientY-r.top)/(r.height/H);
    if (ty > H*0.6) { if (tx<W*0.35) touchLeft=true; else if (tx>W*0.65) touchRight=true; else touchJump=true; }
    else touchJump=true;
  }
}
window.addEventListener('keydown', e => {
  keys[e.code]=true;
  if (['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code)) e.preventDefault();
  if ((e.code==='KeyP'||e.code==='Escape') && state==='playing') paused=!paused;
});
window.addEventListener('keyup', e => keys[e.code]=false);

// ── Particles ──────────────────────────────────────────────
function spawnParticles(x, y, color, count=8) {
  for (let i=0; i<count; i++) {
    const a = (Math.PI*2/count)*i + Math.random()*0.5;
    particles.push({ x, y, vx:Math.cos(a)*3.5, vy:Math.sin(a)*3.5-2,
      life:1, color, size:6+Math.random()*6 });
  }
}

// ── Level Builder ──────────────────────────────────────────
function buildLevel(lvl) {
  platforms=[]; eggs=[]; enemies=[]; particles=[]; bossProjectiles=[]; bossShockwaves=[];
  boss=null; cameraX=0;

  if (lvl === 2)  { buildAlloLevel();       return; }
  if (lvl === 3)  { buildPteranoLevel();    return; }
  if (lvl === 4)  { buildDimorphoLevel();   return; }
  if (lvl === 5)  { buildBossLevel();       return; }
  if (lvl === 6)  { buildCeratoLevel();     return; }
  if (lvl === 7)  { buildIrritatorLevel();  return; }
  if (lvl === 8)  { buildSuchoLevel();      return; }
  if (lvl === 9)  { buildBaryonyxLevel();   return; }
  if (lvl === 10) { buildSeaLevel();        return; }
  if (lvl === 11) { buildNeovenatorLevel(); return; }
  if (lvl === 12) { buildCryoLevel();       return; }
  if (lvl === 13) { buildAlbertoLevel();    return; }
  if (lvl === 14) { buildKronoLevel();      return; }
  if (lvl === 15) { buildGiganoLevel();     return; }
  if (lvl === 16) { buildTarboLevel();      return; }
  if (lvl === 17) { buildCarnoLevel();      return; }
  if (lvl === 18) { buildYantuLevel();      return; }
  if (lvl === 19) { buildMegaloLevel();     return; }
  if (lvl === 20) { buildTRexLevel();       return; }

  // Ground
  for (let x=0; x<WORLD_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#5d8a2a'});

  // Floating platforms
  const plats = [
    {x:200,y:360,w:120},{x:380,y:290,w:100},{x:540,y:340,w:130},
    {x:700,y:260,w:100},{x:850,y:310,w:140},{x:1050,y:240,w:110},
    {x:1230,y:320,w:100},{x:1400,y:260,w:130},{x:1580,y:300,w:120},
    {x:1750,y:220,w:100},{x:1920,y:280,w:140},{x:2100,y:200,w:110},
    {x:2280,y:260,w:100},
  ];
  plats.forEach(p => platforms.push({x:p.x, y:p.y, w:p.w, h:20, color:'#7cb84a'}));

  // Eggs
  const eggSpots = [
    {x:220,y:H-85},{x:300,y:H-85},{x:400,y:270},{x:560,y:320},{x:720,y:240},
    {x:870,y:290},{x:960,y:H-85},{x:1060,y:220},{x:1150,y:H-85},{x:1250,y:300},
    {x:1420,y:240},{x:1590,y:280},{x:1760,y:200},{x:1840,y:H-85},{x:1940,y:260},
    {x:2060,y:H-85},{x:2110,y:180},{x:2200,y:H-85},{x:2290,y:240},{x:2350,y:H-85},
  ];
  eggSpots.forEach((e,i) => eggs.push({
    x:e.x, y:e.y, w:24, h:30, collected:false,
    color:['#ff9800','#e91e63','#9c27b0','#03a9f4','#8bc34a','#ff5722','#ffc107'][i%7],
    bobOffset:Math.random()*Math.PI*2
  }));

  // Enemies
  const enemyXs = [300,650,950,1250,1500,1800,2050,2280,480,1100];
  const cnt = Math.min(3+lvl*2, enemyXs.length);
  for (let i=0; i<cnt; i++)
    enemies.push({ x:enemyXs[i], y:H-100, w:44, h:44,
      vx:(0.8+lvl*0.3)*(i%2?-1:1),
      frame:0, frameTimer:0, startX:enemyXs[i], range:160+Math.random()*80 });
}

function buildBossLevel() {
  // Solid ground wall-to-wall — boss can NEVER fall off
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#4a2a0a'});

  // Raised platforms for jumping opportunities
  [{x:150,y:340,w:120},{x:360,y:270,w:100},{x:580,y:320,w:120},
   {x:800,y:250,w:100},{x:1000,y:310,w:120},{x:1200,y:270,w:100}]
    .forEach(p => platforms.push({...p, h:20, color:'#8d5524'}));

  // Golden eggs (bonus)
  [{x:170,y:320},{x:380,y:250},{x:600,y:300},{x:820,y:230},{x:1020,y:290}]
    .forEach((e,i) => eggs.push({
      x:e.x, y:e.y, w:24, h:30, collected:false, color:'#ffd700',
      bobOffset:Math.random()*Math.PI*2
    }));

  // Boss — starts at right side, patrols left toward player
  boss = {
    x:950, y:H-120, w:130, h:120, hp:5, maxHp:5,
    vx:-1.5, facing:-1, frame:0, frameTimer:0,
    state:'intro',      // intro → patrol → charge/stun → defeated
    stateTimer:180,     // intro lasts ~3 seconds before he attacks
    invincible:0,
    chargeSpeed:7,
    speechBubble: true, // show "You made it, huh?" during intro
    // defeated walk-off state
    defeatTimer:0,
    ARENA_W,
  };
}

function buildAlloLevel() {
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#4a3800'});
  [{x:110,y:320,w:120},{x:300,y:265,w:100},{x:490,y:310,w:120},
   {x:690,y:255,w:100},{x:880,y:300,w:120},{x:1080,y:250,w:100},{x:1250,y:280,w:110}]
    .forEach(p => platforms.push({...p, h:20, color:'#7a6010'}));
  [{x:130,y:300},{x:320,y:245},{x:510,y:290},{x:710,y:235},{x:900,y:280},{x:1100,y:230}]
    .forEach(e => eggs.push({x:e.x, y:e.y, w:24, h:30, collected:false, color:'#ffd700', bobOffset:Math.random()*Math.PI*2}));
  boss = { x:950, y:H-140, w:120, h:130, hp:5, maxHp:5, vx:-2.0, facing:-1,
    frame:0, frameTimer:0, state:'intro', stateTimer:180, invincible:0,
    chargeSpeed:8, ARENA_W, type:'allo',
    speechBubble:true, speechText:'Hey, you showed up!?', defeatTimer:0, frustratedBubble:false };
}

function buildSeaLevel() {
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#004d40'});
  // Coral/rock pillars
  [{x:100,y:310,w:110},{x:290,y:260,w:100},{x:470,y:300,w:110},
   {x:660,y:250,w:100},{x:840,y:290,w:110},{x:1030,y:240,w:100},{x:1220,y:270,w:110}]
    .forEach(p => platforms.push({...p, h:20, color:'#ff6f00'}));
  [{x:120,y:290},{x:310,y:240},{x:490,y:280},{x:680,y:230},{x:860,y:270},{x:1050,y:220}]
    .forEach(e => eggs.push({x:e.x, y:e.y, w:24, h:30, collected:false, color:'#ffd700', bobOffset:Math.random()*Math.PI*2}));
  boss = { x:950, y:H-110, w:150, h:100, hp:5, maxHp:5, vx:-1.8, facing:-1,
    frame:0, frameTimer:0, state:'intro', stateTimer:180, invincible:0,
    chargeSpeed:6, ARENA_W, type:'mosa', vy:0,
    speechBubble:true, speechText:'You dare enter MY ocean?!', defeatTimer:0, frustratedBubble:false };
}

function buildAlbertoLevel() {
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#1a1a2e'});
  [{x:100,y:310,w:115},{x:295,y:250,w:100},{x:490,y:295,w:115},
   {x:685,y:245,w:100},{x:880,y:290,w:115},{x:1075,y:240,w:100},{x:1250,y:270,w:110}]
    .forEach(p => platforms.push({...p, h:20, color:'#4a148c'}));
  [{x:120,y:290},{x:315,y:230},{x:510,y:275},{x:705,y:225},{x:900,y:270},{x:1095,y:220}]
    .forEach(e => eggs.push({x:e.x, y:e.y, w:24, h:30, collected:false, color:'#ffd700', bobOffset:Math.random()*Math.PI*2}));
  boss = { x:950, y:H-155, w:130, h:145, hp:5, maxHp:5, vx:-2.0, facing:-1,
    frame:0, frameTimer:0, state:'intro', stateTimer:185, invincible:0,
    chargeSpeed:9, ARENA_W, type:'alberto',
    speechBubble:true, speechText:'You found me in MY cave?!', defeatTimer:0, frustratedBubble:false };
}

function buildKronoLevel() {
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#0d0d2e'});
  [{x:100,y:300,w:120},{x:300,y:240,w:105},{x:505,y:285,w:120},
   {x:710,y:235,w:105},{x:915,y:280,w:120},{x:1120,y:230,w:105},{x:1280,y:260,w:110}]
    .forEach(p => platforms.push({...p, h:20, color:'#1565c0'}));
  [{x:120,y:280},{x:320,y:220},{x:525,y:265},{x:730,y:215},{x:935,y:260},{x:1140,y:210}]
    .forEach(e => eggs.push({x:e.x, y:e.y, w:24, h:30, collected:false, color:'#ffd700', bobOffset:Math.random()*Math.PI*2}));
  boss = { x:950, y:H-160, w:160, h:150, hp:6, maxHp:6, vx:-1.7, facing:-1,
    frame:0, frameTimer:0, state:'intro', stateTimer:190, invincible:0,
    chargeSpeed:7, ARENA_W, type:'krono',
    speechBubble:true, speechText:'NOTHING escapes the deep!!', defeatTimer:0, frustratedBubble:false };
}

function buildGiganoLevel() {
  const ARENA_W = 1400;
  for (let x=0; x<ARENA_W; x+=80)
    platforms.push({x, y:H-60, w:80, h:60, color:'#3e2723'});
  [{x:90,y:300,w:120},{x:285,y:235,w:110},{x:480,y:280,w:120},

// ── Update ─────────────────────────────────────────────────
function update(ts) {
  if (state !== 'playing') return;
  if (paused) { lastTime = ts; return; }
  const dt = Math.min((ts-lastTime)/16.67, 3);
  lastTime = ts;

  // ── Player ──
  const left  = keys['ArrowLeft']  || keys['KeyA'] || touchLeft;
  const right = keys['ArrowRight'] || keys['KeyD'] || touchRight;
  const jump  = keys['ArrowUp']    || keys['KeyW'] || keys['Space'] || touchJump;

  player.vx = left ? -SPEED : right ? SPEED : 0;
  if (left)  player.facing = -1;
  if (right) player.facing =  1;
  if (jump && player.onGround) { player.vy = JUMP_FORCE; player.onGround=false; }

  player.vy += GRAVITY*dt;
  player.x  += player.vx*dt;
  player.y  += player.vy*dt;
  player.x   = Math.max(0, Math.min(player.x, WORLD_W-player.w));

  player.onGround = false;
  for (const p of platforms) {
    if (player.x+player.w > p.x && player.x < p.x+p.w &&
        player.y+player.h > p.y && player.y+player.h < p.y+p.h+16 && player.vy>=0) {
      player.y = p.y-player.h; player.vy=0; player.onGround=true;
    }
  }
  if (player.y > H+50) loseLife();

  if (player.vx!==0) {
    player.frameTimer += dt;
    if (player.frameTimer>5) { player.frame=(player.frame+1)%6; player.frameTimer=0; }
  } else player.frame=0;
  if (player.invincible>0) player.invincible-=dt;

  cameraX = Math.max(0, Math.min(player.x-W/3, WORLD_W-W));

  // ── Eggs ──
  const t = Date.now()/600;
  for (const egg of eggs) {
    if (egg.collected) continue;
    const bobY = egg.y + Math.sin(t+egg.bobOffset)*4;
    if (player.x+player.w>egg.x && player.x<egg.x+egg.w &&
        player.y+player.h>bobY   && player.y<bobY+egg.h) {
      egg.collected=true; score++;
      document.getElementById('score').textContent=score;
      spawnParticles(egg.x+12, bobY+15, egg.color, 10);
    }
  }

  // ── Normal level win ──
  if (level === 1 && eggs.every(e => e.collected)) {
    level++;
    document.getElementById('level').textContent=level;
    state='win';
    showMessage('⚠️ Beware!', 'Iggy collected all the eggs!\n\nBut now...\n🦴 THE ALLOSAURUS awaits!\n\nJump on its head 5 times!\nWatch out for those CLAWS!', 'Face the Boss! 💪');
    return;
  }

  // ── Normal enemies ──
  for (const en of enemies) {
    en.frameTimer+=dt;
    if (en.frameTimer>8) { en.frame=(en.frame+1)%2; en.frameTimer=0; }
    en.x += en.vx*dt;
    if (Math.abs(en.x-en.startX)>en.range) en.vx*=-1;
    en.y = H-100;

    if (player.invincible<=0 &&
        player.x+player.w-8>en.x && player.x+8<en.x+en.w &&
        player.y+player.h-8>en.y && player.y+8<en.y+en.h) {
      if (player.vy>0 && player.y+player.h < en.y+en.h*0.5) {
        spawnParticles(en.x+22, en.y+22, '#ff9800', 12);
        en.x=-9999; player.vy=JUMP_FORCE*0.7;
      } else loseLife();
    }
  }

  // ── Boss ──
  if (boss) updateBoss(dt);

  // ── Boss projectiles ──
  for (const pb of bossProjectiles) {
    pb.x += pb.vx*dt; pb.y += pb.vy*dt; pb.vy += 0.3*dt;
    pb.life -= dt*0.012;
    if (player.invincible<=0 &&
        Math.abs(pb.x-player.x-player.w/2)<22 && Math.abs(pb.y-player.y-player.h/2)<22) {
      pb.life=0; loseLife();
    }
  }
  bossProjectiles = bossProjectiles.filter(p => p.life>0 && p.y<H+40);

  // ── Particles ──
  for (const p of particles) {
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.15*dt;
    p.life-=0.025*dt; p.size*=0.97;
  }
  particles = particles.filter(p => p.life>0);
}

function updateBoss(dt) {
  boss.frameTimer += dt;
  if (boss.frameTimer > 7) { boss.frame=(boss.frame+1)%4; boss.frameTimer=0; }
  if (boss.invincible > 0) boss.invincible -= dt;
  boss.stateTimer -= dt;

  const WALL_L = 20;
  const WALL_R = (boss.ARENA_W || 1400) - boss.w - 20;
  const px = player.x + player.w/2;
  const bx = boss.x + boss.w/2;

  // Mosasaurus can leave ground during breach; Pteranodon flies freely; everyone else is pinned
  if (boss.state !== 'breach' && boss.type !== 'ptero' && boss.type !== 'dimorpho') boss.y = H - boss.h - 60;

  // ── Intro ──
  if (boss.state === 'intro') {
    boss.facing = px > bx ? 1 : -1;
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=120; boss.speechBubble=false; }
    return;
  }

  // ── Defeated: stomp off screen in frustration ──
  if (boss.state === 'defeated') {
    boss.x += 2.5 * dt;
    boss.defeatTimer -= dt;
    if (boss.defeatTimer <= 0 && state==='playing') {
      const nextLevel = level + 1;
      if (nextLevel > 20) {
        state='win';
        showMessage('🏆 ULTIMATE CHAMPION!',
          `Iggy defeated ALL the bosses!\n\nYou are the greatest dinosaur\nadventurer EVER!\n\nScore: ${score} 🥚`, 'Play Again! 🦖');
      } else {
        level = nextLevel;
        document.getElementById('level').textContent = level;
        state='win';
        const warns = {
          3:  ['🦅 Into the Storm!',    'The PTERANODON rules the sky!\nJump on its head 5 times!\nTime your jumps when it dives!',              'Fly High! 🦅'],
          4:  ['🌧️ Rainy Skies!',       'DIMORPHODON swoops through the rain!\nJump on its head 5 times!\nWatch for swooping bites!',             'Take Flight! 🦇'],
          5:  ['🦕 Spino Showdown!',    'THE SPINOSAURUS is waiting!\nJump on its head 5 times!\nWatch that giant sail!',                          'Fight! 🦕'],
          6:  ['☠️ Toxic Swamps!',      'The CERATOSAURUS lurks in poison waters!\nJump on its head 5 times!\nAvoid the toxic pools!',             'Dodge It! ☠️'],
          7:  ['🐊 Lakeside Battle!',   'The IRRITATOR lurks in the reeds!\nJump on its head 5 times!\nWatch for the tail whip!',                  'Splash! 🐊'],
          8:  ['⛈️ Stormy Lake!',       'SUCHOMIMUS hunts in the storm!\nJump on its head 5 times!\nWatch for the snout slam!',                   'Storm In! ⛈️'],
          9:  ['🌊 Raging River!',      'BARYONYX guards the river!\nJump on its head 5 times!\nBeware the claw slash!',                           'Cross It! 🌊'],
          10: ['🌊 Into the Deep!',     'The MOSASAURUS lurks below!\nJump on its head 5 times!\nWatch out for torpedoes!',                        'Dive In! 🌊'],
          11: ['🌿 Swamp Crossing!',    'The NEOVENATOR patrols the marsh!\nJump on its head 5 times!\nDon\'t get stuck in the mud!',             'Swamp It! 🌿'],
          12: ['❄️ Frozen Showdown!',   'CRYOLOPHOSAURUS will KICK you like a ball!\nJump on its head 5 times!\nDodge those powerful legs!',      'Duck! ❄️'],
          13: ['🦇 Into the Cave!',     'ALBERTOSAURUS hunts in the dark!\nJump on its head 5 times!\nWatch for the echo screech!',                'Spelunk! 🦇'],
          14: ['🌌 Twilight Zone!',     'KRONOSAURUS rules the deep!\nJump on its head 5 times!\nAvoid the crushing bite!',                        'Go Deep! 🌌'],
          15: ['🏔️ Rocky Cliffs!',      'GIGANOTOSAURUS towers above!\nJump on its head 7 times!\nBeware the stomp shockwave!',                   'Climb! 🏔️'],
          16: ['🟤 Mud Pit!',           'TARBOSAURUS charges through the mud!\nJump on its head 5 times!\nDon\'t slip in the muck!',               'Charge! 🟤'],
          17: ['🌋 Volcanic Land!',     'The CARNOTAURUS and its horns!\nJump on its head 5 times!\nIt charges FAST!',                             'Charge! 🌋'],
          18: ['🏔️ Mountain Summit!',   'YANTUANOSAURUS rules the peaks!\nJump on its head 6 times!\nWatch for the boulder rockslide!',             'Climb! 🏔️'],
          19: ['🪨 Underground Lair!',  'MEGALOSAURUS lurks in the dark!\nJump on its head 5 times!\nDodge the ground-shaking STOMP!',             'Dig In! 🪨'],
          20: ['💀 FINAL BOSS!',        'THE T-REX — King of them all!\nJump on its head 7 times!\nBeware the ROAR!',                              'Face It! 🦖'],
        };
        const w = warns[level];
        showMessage(w[0], w[1], w[2]);
      }
    }
    return;
  }

  // ── Mosasaurus: breach (jump up) ──
  if (boss.state === 'breach') {
    boss.vy = (boss.vy||0) + GRAVITY*dt;
    boss.y  += boss.vy*dt;
    const floor = H - boss.h - 60;
    if (boss.y >= floor) { boss.y=floor; boss.vy=0; boss.state='patrol'; boss.stateTimer=90; }
  }

  // ── T-Rex roar shockwave ──
  if (boss.state === 'roar') {
    if (boss.stateTimer === Math.floor(boss.stateTimer) && boss.stateTimer <= 40 && boss.stateTimer > 38) {
      // emit shockwave on first tick of roar window
      bossShockwaves.push({ x: bx, y: boss.y + boss.h*0.3, radius:10, speed:5, life:1 });
      spawnParticles(bx, boss.y+20, '#ffe082', 20);
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=130; }
  }

  // ── Allosaurus: claw swipe ──
  if (boss.state === 'claw') {
    // On the active swing frames, check if player is in claw reach
    if (boss.stateTimer <= 28 && boss.stateTimer > 10 && player.invincible <= 0) {
      const clawReach = 110;
      const clawX = bx + (boss.facing > 0 ? boss.w : -clawReach);
      const clawY = boss.y;
      const clawH = boss.h * 0.7;
      if (px+player.w > clawX && px < clawX+clawReach && player.y+player.h > clawY && player.y < clawY+clawH) {
        player.vy = JUMP_FORCE * 0.5;
        player.vx = -boss.facing * 5;
        if (!easyMode) {
          player.invincible = 60;
          lives--;
          document.getElementById('lives').textContent = '🥚'.repeat(Math.max(0,lives));
          spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff4444', 12);
          if (lives <= 0) { state='dead'; showMessage('💀 Oh no!','Iggy got clawed!\n\nPress Play Again to try again!','Play Again! 🦖'); }
        } else { player.invincible = 60; spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ffd700', 8); }
      }
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=110; }
  }

  // ── Pteranodon: glide y tracking ──
  if (boss.type === 'ptero' && boss.state === 'patrol') {
    boss.y += (boss.glideY - boss.y) * 0.04 * dt;
    if (Math.random() < 0.005) boss.glideY = 120 + Math.random() * 140;
    boss.facing = boss.vx > 0 ? 1 : -1;
  }

  // ── Dimorphodon: glide y tracking ──
  if (boss.type === 'dimorpho' && boss.state === 'patrol') {
    boss.y += (boss.glideY - boss.y) * 0.05 * dt;
    if (Math.random() < 0.006) boss.glideY = 100 + Math.random() * 160;
    boss.facing = boss.vx > 0 ? 1 : -1;
  }

  // ── Pteranodon: dive ──
  if (boss.state === 'dive') {
    boss.y += (boss.targetY - boss.y) * 0.08 * dt;
    boss.facing = px > bx ? 1 : -1;
    if (Math.abs(boss.y - boss.targetY) < 10) {
      boss.state='swoop'; boss.stateTimer=40; boss.glideY=100+Math.random()*140;
    }
  }

  // ── Pteranodon: swoop back up ──
  if (boss.state === 'swoop') {
    boss.y += (boss.glideY - boss.y) * 0.1 * dt;
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Dimorphodon: dive ──
  if (boss.type === 'dimorpho' && boss.state === 'dive') {
    boss.y += (boss.targetY - boss.y) * 0.1 * dt;
    boss.facing = px > bx ? 1 : -1;
    if (Math.abs(boss.y - boss.targetY) < 12) {
      boss.state='swoop'; boss.stateTimer=35; boss.glideY=90+Math.random()*160;
    }
  }
  if (boss.type === 'dimorpho' && boss.state === 'swoop') {
    boss.y += (boss.glideY - boss.y) * 0.12 * dt;
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=90; }
  }

  // ── Irritator: tail whip ──
  if (boss.state === 'tailwhip') {
    if (boss.stateTimer <= 35 && boss.stateTimer > 15 && player.invincible <= 0) {
      // Damage player if BEHIND the boss within 120px
      const behindX = boss.facing > 0 ? boss.x - player.x - player.w : player.x - (boss.x + boss.w);
      if (behindX > 0 && behindX < 120 &&
          player.y + player.h > boss.y && player.y < boss.y + boss.h) {
        player.vy = JUMP_FORCE * 0.5;
        player.vx = -boss.facing * 5;
        if (!easyMode) {
          player.invincible = 60;
          lives--;
          document.getElementById('lives').textContent = lives;
          spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff4444', 12);
          if (lives <= 0) { state='dead'; showMessage('💀 Oh no!','Iggy got tail-whipped!\n\nPress Play Again to try again!','Play Again! 🦖'); }
        } else { player.invincible = 60; spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ffd700', 8); }
      }
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Neovenator: leap ──
  if (boss.state === 'leap') {
    boss.vy += GRAVITY * dt;
    boss.y  += boss.vy * dt;
    boss.x  += (boss.targetLeapX - bx) * 0.04 * dt;
    const leapFloor = H - boss.h - 60;
    if (boss.y >= leapFloor) {
      boss.y=leapFloor; boss.vy=0; boss.state='patrol'; boss.stateTimer=100;
      spawnParticles(boss.x+boss.w/2, boss.y+boss.h, '#4a7c3f', 16);
    }
    if (boss.stateTimer <= 0 && boss.state==='leap') { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Patrol ──
  if (boss.state === 'patrol') {
    boss.x += boss.vx * dt;
    if (boss.x <= WALL_L) { boss.x=WALL_L; boss.vx=Math.abs(boss.vx); }
    if (boss.x >= WALL_R) { boss.x=WALL_R; boss.vx=-Math.abs(boss.vx); }
    boss.facing = boss.vx > 0 ? 1 : -1;

    if (boss.stateTimer <= 0) {
      const roll = Math.random();
      const aggression = 1 - (boss.hp / boss.maxHp) * 0.4; // gets more aggressive when low hp

      if (boss.type === 'cerato' && roll < 0.4 * aggression) {
        // Toxic spit!
        boss.state='toxicspit'; boss.stateTimer=45;
        bossProjectiles.push({ x:bx+(boss.facing>0?boss.w:0), y:boss.y+boss.h*0.6,
          vx:boss.facing*4, vy:0.5, r:10, color:'#39ff14', life:1, size:14 });
        bossProjectiles.push({ x:bx+(boss.facing>0?boss.w:0), y:boss.y+boss.h*0.6,
          vx:boss.facing*5.5, vy:-0.5, r:8, color:'#00ff66', life:1, size:10 });
      } else if (boss.type === 'cryo' && roll < 0.45 * aggression) {
        // Kick!
        boss.state='kick'; boss.stateTimer=55; boss.facing = px > bx ? 1 : -1;
      } else if (boss.type === 'allo' && roll < 0.45 * aggression) {
        // Claw swipe!
        boss.state='claw'; boss.stateTimer=40;
        boss.facing = px > bx ? 1 : -1;
      } else if (boss.type === 'mosa' && roll < 0.3 * aggression) {
        // Breach!
        boss.state='breach'; boss.stateTimer=80;
        boss.vy = -11;
        fireBlob(); fireBlob();
      } else if (boss.type === 'trex' && roll < 0.35 * aggression) {
        // Roar!
        boss.state='roar'; boss.stateTimer=55;
      } else if (boss.type === 'ptero' && roll < 0.5) {
        // Dive or fire blob
        if (Math.random() < 0.5) {
          boss.state='dive'; boss.stateTimer=70; boss.targetY=H-160;
        } else {
          fireBlob();
          boss.stateTimer = Math.max(60, 140 - (boss.maxHp - boss.hp) * 20);
        }
      } else if (boss.type === 'irri' && roll < 0.4 * aggression) {
        // Tail whip!
        boss.state='tailwhip'; boss.stateTimer=50;
      } else if (boss.type === 'neo' && roll < 0.35 * aggression) {
        // Leap!
        boss.state='leap'; boss.stateTimer=60; boss.vy=-14; boss.targetLeapX=px;
      } else if (boss.type === 'dimorpho' && roll < 0.55 * aggression) {
        boss.state='dive'; boss.stateTimer=65; boss.targetY=H-140;
      } else if (boss.type === 'sucho' && roll < 0.38 * aggression) {
        boss.state = 'snoutslam'; boss.stateTimer = 50; boss.facing = px > bx ? 1 : -1;
      } else if (boss.type === 'bary' && roll < 0.42 * aggression) {
        boss.state = 'clawslash'; boss.stateTimer = 48; boss.facing = px > bx ? 1 : -1;
      } else if (boss.type === 'alberto' && roll < 0.38 * aggression) {
        // Echo screech — fires 3 blobs in a spread
        fireBlob(); fireBlob();
        bossProjectiles.push({ x:boss.x+(boss.facing>0?boss.w:0), y:boss.y+20,
          vx:boss.facing*3, vy:-3, life:1, size:10 });
        boss.stateTimer = Math.max(60, 150 - (boss.maxHp-boss.hp)*18);
      } else if (boss.type === 'krono' && roll < 0.35 * aggression) {
        boss.state='lunge'; boss.stateTimer=55; boss.facing = px > bx ? 1 : -1;
      } else if (boss.type === 'megalo' && roll < 0.4 * aggression) {
        boss.state='stomp'; boss.stateTimer=55;
        setTimeout(()=>{
          if(boss) {
            bossShockwaves.push({x:boss.x+boss.w/2, y:boss.y+boss.h, radius:10, speed:7, life:1});
            bossShockwaves.push({x:boss.x+boss.w/2, y:boss.y+boss.h, radius:10, speed:-7, life:1});
          }
        }, 350);
      } else if (boss.type === 'yantu' && roll < 0.35 * aggression) {
        boss.state='rockfall'; boss.stateTimer=90;
        for (let i=0; i<4; i++) {
          setTimeout(()=>{ if(boss) bossProjectiles.push({
            x: cameraX+80+Math.random()*(W-160), y:-20,
            vx:(Math.random()-0.5)*2, vy:5+Math.random()*3, life:1, size:14, color:'#78909c'
          }); }, i*400);
        }
      } else if (boss.type === 'gigano' && roll < 0.3 * aggression) {
        boss.state='stomp'; boss.stateTimer=60;
        // Stomp shockwave — uses existing bossShockwaves system
        setTimeout(()=>{
          if(boss) bossShockwaves.push({x:boss.x+boss.w/2, y:boss.y+boss.h, radius:10, speed:6, life:1});
        }, 400);
      } else if (boss.type === 'tarbo' && roll < 0.4 * aggression) {
        boss.state='mudcharge'; boss.stateTimer = 50 + boss.hp*3;
        boss.facing = px > bx ? 1 : -1;
      } else if (roll < 0.5) {
        fireBlob();
        boss.stateTimer = Math.max(60, 170 - (boss.maxHp - boss.hp) * 20);
      } else {
        boss.state='charge'; boss.stateTimer = 45 + boss.hp*4;
        boss.facing = px > bx ? 1 : -1;
      }
    }
  }

  // ── Charge ──
  else if (boss.state === 'charge') {
    boss.x += boss.facing * boss.chargeSpeed * dt;
    if (boss.x <= WALL_L) { boss.x=WALL_L; boss.state='patrol'; boss.stateTimer=80; }
    if (boss.x >= WALL_R) { boss.x=WALL_R; boss.state='patrol'; boss.stateTimer=80; }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Stun ──
  else if (boss.state === 'stun') {
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Megalosaurus: stomp shockwave ──
  if (boss.state === 'stomp' && boss.type === 'megalo') {
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Yantuanosaurus: rockfall (boulders already queued via setTimeout) ──
  if (boss.state === 'rockfall') {
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Ceratosaurus: toxic spit (just waits, projectiles already fired) ──
  if (boss.state === 'toxicspit') {
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Cryolophosaurus: kick ──
  if (boss.state === 'kick') {
    if (boss.stateTimer <= 40 && boss.stateTimer > 20 && player.invincible <= 0) {
      const kickReach = 130;
      const kickX = bx + (boss.facing > 0 ? boss.w : -kickReach);
      if (px+player.w > kickX && px < kickX+kickReach && player.y+player.h > boss.y+boss.h*0.3 && player.y < boss.y+boss.h) {
        player.vy = -11;
        player.vx = boss.facing * 13;
        if (!easyMode) {
          player.invincible = 70;
          lives--;
          document.getElementById('lives').textContent = '🥚'.repeat(Math.max(0,lives));
          spawnParticles(player.x+player.w/2, player.y, '#ff8800', 16);
          if (lives <= 0) { state='dead'; showMessage('💀 Got Kicked!','Iggy got booted!\n\nPress Play Again to retry!','Play Again! 🦖'); }
        } else { player.invincible = 70; spawnParticles(player.x+player.w/2, player.y, '#ffd700', 10); }
      }
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=110; }
  }

  // ── Suchomimus: snout slam ──
  if (boss.state === 'snoutslam') {
    if (boss.stateTimer <= 35 && boss.stateTimer > 18 && player.invincible <= 0) {
      const slamReach = 140;
      const slamX = bx + (boss.facing > 0 ? boss.w : -slamReach);
      if (px+player.w > slamX && px < slamX+slamReach && player.y+player.h > boss.y && player.y < boss.y+boss.h*0.5) {
        player.vy = JUMP_FORCE * 0.6;
        player.vx = -boss.facing * 6;
        if (!easyMode) {
          player.invincible = 65;
          lives--;
          document.getElementById('lives').textContent = lives;
          spawnParticles(player.x+player.w/2, player.y+player.h/2, '#4fc3f7', 12);
          if (lives <= 0) { state='dead'; showMessage('💀 Slammed!','Iggy got snout-slammed!\n\nPress Play Again to retry!','Play Again! 🦖'); }
        } else { player.invincible = 65; spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ffd700', 8); }
      }
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=105; }
  }

  // ── Baryonyx: claw slash ──
  if (boss.state === 'clawslash') {
    if (boss.stateTimer <= 34 && boss.stateTimer > 14 && player.invincible <= 0) {
      const slashReach = 120;
      const slashX = bx + (boss.facing > 0 ? boss.w : -slashReach);
      if (px+player.w > slashX && px < slashX+slashReach && player.y+player.h > boss.y+10 && player.y < boss.y+boss.h*0.75) {
        player.vy = JUMP_FORCE * 0.55;
        player.vx = -boss.facing * 6;
        if (!easyMode) {
          player.invincible = 62;
          lives--;
          document.getElementById('lives').textContent = lives;
          spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff7043', 12);
          if (lives <= 0) { state='dead'; showMessage('💀 Slashed!','Iggy got claw-slashed!\n\nPress Play Again to retry!','Play Again! 🦖'); }
        } else { player.invincible = 62; spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ffd700', 8); }
      }
    }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }
  // ── Kronosaurus: lunge bite ──
  if (boss.state === 'lunge') {
    boss.x += boss.facing * 7 * dt;
    if (boss.stateTimer <= 38 && boss.stateTimer > 18 && player.invincible <= 0) {
      const lungeReach = 150;
      const lungeX = bx + (boss.facing > 0 ? boss.w : -lungeReach);
      if (px+player.w > lungeX && px < lungeX+lungeReach && player.y+player.h > boss.y && player.y < boss.y+boss.h*0.6) {
        player.vy = JUMP_FORCE * 0.5; player.vx = -boss.facing * 5;
        if (!easyMode) {
          player.invincible=68; lives--;
          document.getElementById('lives').textContent=lives;
          spawnParticles(player.x+player.w/2,player.y+player.h/2,'#1565c0',12);
          if(lives<=0){state='dead';showMessage('💀 Chomped!','Iggy got bitten!\n\nPress Play Again!','Play Again! 🦖');}
        } else { player.invincible=68; spawnParticles(player.x+player.w/2,player.y,'#ffd700',8); }
      }
    }
    if (boss.x <= 40) { boss.x=40; boss.state='patrol'; boss.stateTimer=100; }
    const WALL_R2 = (boss.ARENA_W||1400)-boss.w-40;
    if (boss.x >= WALL_R2) { boss.x=WALL_R2; boss.state='patrol'; boss.stateTimer=100; }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Giganotosaurus: stomp ──
  if (boss.state === 'stomp') {
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=120; }
  }

  // ── Tarbosaurus: mud charge (slower than normal charge, spawns mud particles) ──
  if (boss.state === 'mudcharge') {
    boss.x += boss.facing * boss.chargeSpeed * 0.75 * dt;
    if (Math.random()<0.3) spawnParticles(boss.x+boss.w/2, boss.y+boss.h, '#795548', 3);
    const WALL_L3 = 40, WALL_R3 = (boss.ARENA_W||1400)-boss.w-40;
    if (boss.x <= WALL_L3) { boss.x=WALL_L3; boss.state='patrol'; boss.stateTimer=90; }
    if (boss.x >= WALL_R3) { boss.x=WALL_R3; boss.state='patrol'; boss.stateTimer=90; }
    if (boss.stateTimer <= 0) { boss.state='patrol'; boss.stateTimer=100; }
  }

  // ── Shockwave update ──
  for (const sw of bossShockwaves) {
    sw.radius += sw.speed * dt;
    sw.life   -= 0.018 * dt;
    if (player.invincible <= 0) {
      const dist = Math.hypot(player.x+player.w/2 - sw.x, player.y+player.h/2 - sw.y);
      if (dist < sw.radius + 10 && dist > sw.radius - 30 && !sw.hit) {
        sw.hit = true;
        player.vx = (player.x < sw.x ? -1 : 1) * 7;
        loseLife();
      }
    }
  }
  bossShockwaves = bossShockwaves.filter(sw => sw.life > 0);

  // ── Player vs Boss collision ──
  if (player.invincible > 0 || boss.state === 'defeated') return;

  const overlapX = player.x + player.w - 8 > boss.x && player.x + 8 < boss.x + boss.w;
  if (!overlapX) return;

  const playerBottom = player.y + player.h;
  const bossTop      = boss.y;
  const inStompRange = playerBottom >= bossTop - 8 && playerBottom <= bossTop + boss.h * 0.45;

  if (player.vy > 0 && inStompRange && boss.invincible <= 0) {
    player.y  = bossTop - player.h;
    player.vy = JUMP_FORCE * 0.75;
    player.invincible = 80;
    boss.hp--;
    boss.invincible = 50;
    spawnParticles(boss.x + boss.w/2, bossTop+10, '#ffd700', 16);

    if (boss.hp <= 0) {
      boss.hp = 0;
      boss.state = 'defeated';
      boss.defeatTimer = 200;
      boss.speechBubble = false;
      boss.frustratedBubble = true;
      for (let i=0;i<25;i++) setTimeout(()=>spawnParticles(
        boss.x+Math.random()*boss.w, boss.y+Math.random()*boss.h,
        ['#ffd700','#ff6d00','#e91e63','#00bcd4'][Math.floor(Math.random()*4)], 8
      ), i*90);
      setTimeout(()=>{ boss.frustratedBubble=false; }, 2200);
    } else {
      boss.state='stun'; boss.stateTimer=60;
    }
    return;
  }

  const overlapY = playerBottom > bossTop+10 && player.y < boss.y+boss.h-10;
  if (overlapY && boss.state !== 'stun') loseLife();
}

function fireBlob() {
  const px = player.x+player.w/2, py = player.y+player.h/2;
  const bx = boss.x + (boss.facing>0 ? boss.w : 0);
  const by = boss.y + 30;
  const dx = px-bx, dy = py-by;
  const len = Math.sqrt(dx*dx+dy*dy)||1;
  bossProjectiles.push({ x:bx, y:by, vx:(dx/len)*4.5, vy:(dy/len)*3-2, life:1, size:14 });
}

// ── Lose life ──────────────────────────────────────────────
function loseLife() {
  if (player.invincible>0) return;
  if (easyMode) { player.invincible=60; return; }
  lives--;
  document.getElementById('lives').textContent=lives;
  spawnParticles(player.x+player.w/2, player.y+player.h/2, '#ff4444', 14);
  if (lives<=0) {
    state='gameover';
    showMessage('😢 Oh No!', `Iggy needs more practice!\n\nYou collected ${score} eggs 🥚`, 'Try Again! 💪');
  } else {
    player.invincible=90; player.x=80; player.y=300; player.vx=0; player.vy=0; cameraX=0;
  }
}

// ── Draw Helpers ───────────────────────────────────────────
function drawRoundRect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
  if (fill)   { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke(); }
}

// ── Draw: Iggy the Orange Velociraptor ─────────────────────
function drawIggy(x, y, facing, frame, invincible) {
  if (invincible>0 && Math.floor(invincible/6)%2===0) return;
  ctx.save();
  // Pivot near hip; velociraptor runs leaned forward
  ctx.translate(x+24, y+30);
  ctx.scale(facing, 1);

  const run  = Math.sin(frame*1.7)*10;
  const run2 = Math.cos(frame*1.7)*10;
  const lean = player.vx!==0 ? 0.28 : 0.1; // lean forward when running
  ctx.rotate(lean);

  // ── Long stiff tail (balance counter-weight) ──
  ctx.beginPath();
  ctx.moveTo(-10, 8);
  ctx.bezierCurveTo(-28, 6, -52, 4, -72, 8+Math.sin(frame*0.8)*3);
  ctx.bezierCurveTo(-64, 12, -30, 14, -10, 14);
  ctx.fillStyle='#e65100'; ctx.fill();
  // Tail tip feathers
  ctx.strokeStyle='#bf360c'; ctx.lineWidth=1.5;
  for (let i=0;i<4;i++) {
    ctx.beginPath();
    ctx.moveTo(-70+i*3, 8+i*2);
    ctx.lineTo(-82+i*2, 3+i*4);
    ctx.stroke();
  }

  // ── Body (horizontal, lean) ──
  ctx.beginPath();
  ctx.ellipse(0, 8, 22, 14, 0, 0, Math.PI*2);
  ctx.fillStyle='#ff6d00'; ctx.fill();
  ctx.strokeStyle='#e65100'; ctx.lineWidth=1.5; ctx.stroke();

  // Belly lighter
  ctx.beginPath();
  ctx.ellipse(-2, 12, 14, 9, 0.1, 0, Math.PI*2);
  ctx.fillStyle='#ffccbc'; ctx.fill();

  // ── Arm feathers ──
  ctx.strokeStyle='#ff8f00'; ctx.lineWidth=2;
  [[-4,18,10,28],[-2,20,12,32],[0,18,14,30]].forEach(([ax,ay,bx2,by2]) => {
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx2,by2); ctx.stroke();
  });

  // ── Arms (small, with claws) ──
  ctx.save(); ctx.translate(10, 14); ctx.rotate(-0.5+run*0.02);
  drawRoundRect(0,0,9,14,4,'#ff8f00','#e65100');
  ctx.fillStyle='#bf360c';
  ctx.beginPath(); ctx.moveTo(1,14); ctx.lineTo(-2,20); ctx.lineTo(4,15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6,14); ctx.lineTo(5,20);  ctx.lineTo(9,15); ctx.fill();
  ctx.restore();

  // ── Neck ──
  ctx.beginPath();
  ctx.moveTo(14,2); ctx.bezierCurveTo(22,-4,28,-10,32,-18);
  ctx.bezierCurveTo(28,-12,20,-4,10,4);
  ctx.fillStyle='#ff6d00'; ctx.fill();

  // ── Head ──
  ctx.beginPath();
  ctx.ellipse(34,-26,16,12,-0.2, 0, Math.PI*2);
  ctx.fillStyle='#ff6d00'; ctx.fill();
  ctx.strokeStyle='#e65100'; ctx.lineWidth=1.5; ctx.stroke();

  // Snout (shorter than spino, more triangular)
  ctx.beginPath();
  ctx.moveTo(26,-22);
  ctx.bezierCurveTo(36,-22,52,-24,56,-22);
  ctx.bezierCurveTo(56,-18,48,-17,36,-18);
  ctx.lineTo(26,-18); ctx.closePath();
  ctx.fillStyle='#ff8f00'; ctx.fill();

  // Lower jaw
  ctx.beginPath();
  ctx.moveTo(28,-18);
  ctx.bezierCurveTo(38,-16,50,-16,56,-18);
  ctx.bezierCurveTo(56,-14,46,-12,36,-13);
  ctx.lineTo(28,-14); ctx.closePath();
  ctx.fillStyle='#ff6d00'; ctx.fill();

  // Teeth
  ctx.fillStyle='#fff';
  for (let i=0;i<4;i++) {
    ctx.beginPath(); ctx.moveTo(32+i*5,-18); ctx.lineTo(34+i*5,-22); ctx.lineTo(36+i*5,-18); ctx.fill();
    ctx.beginPath(); ctx.moveTo(33+i*5,-14); ctx.lineTo(35+i*5,-10); ctx.lineTo(37+i*5,-14); ctx.fill();
  }

  // Eye — big, expressive, yellow
  ctx.beginPath(); ctx.arc(30,-28,7,0,Math.PI*2); ctx.fillStyle='#fff8e1'; ctx.fill();
  ctx.beginPath(); ctx.arc(30,-28,5,0,Math.PI*2); ctx.fillStyle='#f57f17'; ctx.fill();
  ctx.beginPath(); ctx.arc(30,-28,3,0,Math.PI*2); ctx.fillStyle='#212121'; ctx.fill();
  ctx.beginPath(); ctx.arc(31,-30,1.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();

  // Nostril
  ctx.beginPath(); ctx.ellipse(50,-22,2,1.5,0.3,0,Math.PI*2); ctx.fillStyle='#e65100'; ctx.fill();

  // ── Head crest / feathers ──
  ctx.strokeStyle='#ff8f00'; ctx.lineWidth=2;
  [{sx:22,sy:-34,ex:18,ey:-44},{sx:26,sy:-36,ex:24,ey:-48},{sx:30,sy:-36,ex:32,ey:-49},{sx:34,sy:-35,ex:38,ey:-46}]
    .forEach(f => { ctx.beginPath(); ctx.moveTo(f.sx,f.sy); ctx.lineTo(f.ex,f.ey); ctx.stroke(); });

  // ── Legs ──
  // Back (thigh + shin + foot)
  ctx.save(); ctx.translate(-12, 16); ctx.rotate(-run*0.04);
  drawRoundRect(-6,0,14,18,5,'#e65100','#bf360c');
  ctx.save(); ctx.translate(0,18); ctx.rotate(run*0.06);
  drawRoundRect(-5,0,12,14,4,'#ff6d00','#e65100');
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,34,12,5,0,0,Math.PI*2); ctx.fillStyle='#e65100'; ctx.fill();
  // Sickle claw!
  ctx.beginPath(); ctx.moveTo(8,30); ctx.bezierCurveTo(18,28,20,22,14,20);
  ctx.strokeStyle='#212121'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();

  // Front leg
  ctx.save(); ctx.translate(4, 18); ctx.rotate(run2*0.04);
  drawRoundRect(-6,0,14,18,5,'#ff8f00','#e65100');
  ctx.save(); ctx.translate(0,18); ctx.rotate(-run2*0.06);
  drawRoundRect(-5,0,12,14,4,'#ff6d00','#e65100');
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(0,34,12,5,0,0,Math.PI*2); ctx.fillStyle='#ff6d00'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(8,30); ctx.bezierCurveTo(18,28,20,22,14,20);
  ctx.strokeStyle='#212121'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();

  // Orange stripe pattern on body
  ctx.strokeStyle='rgba(191,54,12,0.35)'; ctx.lineWidth=2;
  [[-8,2],[-2,0],[4,2],[10,4]].forEach(([sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(sx-2,sy+16); ctx.stroke();
  });

  ctx.restore();
}

// ── Draw: Spinosaurus Boss ──────────────────────────────────
function drawSpinoBoss(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.55);
  ctx.scale(b.facing, 1);

  const frame = b.frame;
  const legSwing = Math.sin(frame*1.6)*9;
  const tailWag  = Math.sin(frame*1.2)*5;
  const breathe  = Math.sin(Date.now()/400)*1.5;

  // Scale up 2.2× for boss size
  ctx.scale(2.2, 2.2);

  // ── Tail ──
  ctx.beginPath();
  ctx.moveTo(-18, 22+breathe);
  ctx.bezierCurveTo(-40+tailWag,28,-62+tailWag*1.5,30,-80+tailWag*2,24);
  ctx.bezierCurveTo(-70,18,-42,16,-18,14);
  ctx.fillStyle='#1b5e20'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-20,20); ctx.bezierCurveTo(-44,24,-64,22,-78,21);
  ctx.strokeStyle='#0d3314'; ctx.lineWidth=2; ctx.stroke();

  // ── Sail ──
  const defeated = b.state === 'defeated';
  const sailBases  = [-14,-6,2,10,18,24];
  // Sail droops when frustrated
  const sailHts    = defeated ? [10,12,14,15,12,8] : [28,34,40,44,38,28];
  ctx.beginPath(); ctx.moveTo(-14,10+breathe);
  sailBases.forEach((bx,i)=>ctx.lineTo(bx,10-sailHts[i]+breathe));
  ctx.lineTo(28,10+breathe); ctx.closePath();
  const sg = ctx.createLinearGradient(-14,-40,28,-40);
  sg.addColorStop(0,'rgba(13,71,161,0.8)'); sg.addColorStop(0.5,'rgba(66,165,245,0.9)'); sg.addColorStop(1,'rgba(13,71,161,0.8)');
  ctx.fillStyle=sg; ctx.fill();
  ctx.strokeStyle='#0d47a1'; ctx.lineWidth=1.5; ctx.stroke();
  sailBases.forEach((bx,i)=>{
    ctx.beginPath(); ctx.moveTo(bx,10+breathe); ctx.lineTo(bx,10-sailHts[i]+breathe);
    ctx.strokeStyle='rgba(13,71,161,0.5)'; ctx.lineWidth=2; ctx.stroke();
  });

  // ── Body ──
  ctx.beginPath(); ctx.ellipse(6,18+breathe,30,18,0,0,Math.PI*2);
  ctx.fillStyle='#2e7d32'; ctx.fill(); ctx.strokeStyle='#1b5e20'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(4,24+breathe,20,12,0.1,0,Math.PI*2);
  ctx.fillStyle='#a5d6a7'; ctx.fill();

  // ── Neck ──
  ctx.beginPath(); ctx.moveTo(20,8+breathe);
  ctx.bezierCurveTo(30,2,36,-2,40,-8);
  ctx.bezierCurveTo(38,-2,32,4,26,12+breathe);
  ctx.fillStyle='#2e7d32'; ctx.fill();

  // ── Head ──
  ctx.beginPath(); ctx.ellipse(46,-14,14,11,-0.15,0,Math.PI*2);
  ctx.fillStyle='#2e7d32'; ctx.fill(); ctx.strokeStyle='#1b5e20'; ctx.lineWidth=2; ctx.stroke();
  // snout
  ctx.beginPath(); ctx.moveTo(38,-10);
  ctx.bezierCurveTo(52,-10,72,-12,82,-11);
  ctx.bezierCurveTo(82,-7,72,-6,52,-6); ctx.lineTo(38,-6); ctx.closePath();
  ctx.fillStyle='#388e3c'; ctx.fill(); ctx.strokeStyle='#1b5e20'; ctx.lineWidth=1.5; ctx.stroke();
  // lower jaw
  ctx.beginPath(); ctx.moveTo(40,-6);
  ctx.bezierCurveTo(54,-5,72,-5,82,-7);
  ctx.bezierCurveTo(82,-3,70,-1,52,-1); ctx.lineTo(40,-2); ctx.closePath();
  ctx.fillStyle='#2e7d32'; ctx.fill();
  // Teeth
  ctx.fillStyle='#f5f5f5';
  for (let i=0;i<5;i++) {
    ctx.beginPath(); ctx.moveTo(50+i*6,-6); ctx.lineTo(52+i*6,-11); ctx.lineTo(54+i*6,-6); ctx.fill();
    ctx.beginPath(); ctx.moveTo(51+i*6,-2); ctx.lineTo(53+i*6,3);  ctx.lineTo(55+i*6,-2); ctx.fill();
  }
  // Eye — red evil; scrunched with X when frustrated/defeated
  ctx.beginPath(); ctx.arc(46,-18,6,0,Math.PI*2); ctx.fillStyle='#ffcdd2'; ctx.fill();
  ctx.beginPath(); ctx.arc(46,-18,4,0,Math.PI*2); ctx.fillStyle='#c62828'; ctx.fill();
  if (defeated) {
    // X eyes = frustrated
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(43,-21); ctx.lineTo(49,-15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(49,-21); ctx.lineTo(43,-15); ctx.stroke();
    // steam puffs above head
    const st = Date.now()/200;
    ctx.fillStyle='rgba(255,100,100,0.7)';
    ctx.beginPath(); ctx.arc(42+Math.sin(st)*2, -34+Math.cos(st)*2, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(50+Math.sin(st+1)*2, -40+Math.cos(st+1)*2, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(46+Math.sin(st+2)*2, -46+Math.cos(st+2)*2, 3, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(47,-18,2.5,0,Math.PI*2); ctx.fillStyle='#212121'; ctx.fill();
    ctx.beginPath(); ctx.arc(48,-20,1.2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  // eyebrow — angry slant steeper when defeated
  ctx.beginPath();
  if (defeated) { ctx.moveTo(38,-28); ctx.lineTo(54,-22); }
  else          { ctx.moveTo(40,-25); ctx.lineTo(52,-28); }
  ctx.strokeStyle='#1b5e20'; ctx.lineWidth=2.5; ctx.stroke();
  // nostril
  ctx.beginPath(); ctx.ellipse(76,-11,2.5,1.5,0.3,0,Math.PI*2); ctx.fillStyle='#1b5e20'; ctx.fill();

  // ── Arms ──
  ctx.save(); ctx.translate(26,18+breathe); ctx.rotate(-0.3+legSwing*0.04);
  drawRoundRect(0,0,9,14,4,'#388e3c','#1b5e20');
  ctx.fillStyle='#0d3314';
  ctx.beginPath(); ctx.moveTo(2,14); ctx.lineTo(0,19); ctx.lineTo(4,15); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6,14); ctx.lineTo(6,19); ctx.lineTo(9,15); ctx.fill();
  ctx.restore();

  // ── Legs ──
  ctx.save(); ctx.translate(-8,30+breathe); ctx.rotate(-legSwing*0.05);
  drawRoundRect(-6,0,16,20,6,'#1b5e20','#0d3314');
  ctx.beginPath(); ctx.ellipse(2,22,12,5,0,0,Math.PI*2); ctx.fillStyle='#1b5e20'; ctx.fill();
  ctx.fillStyle='#0d3314';
  [-8,-2,5,11].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,20);ctx.lineTo(cx-2,27);ctx.lineTo(cx+4,21);ctx.fill();});
  ctx.restore();

  ctx.save(); ctx.translate(10,30+breathe); ctx.rotate(legSwing*0.05);
  drawRoundRect(-6,0,16,20,6,'#2e7d32','#1b5e20');
  ctx.beginPath(); ctx.ellipse(2,22,12,5,0,0,Math.PI*2); ctx.fillStyle='#2e7d32'; ctx.fill();
  ctx.fillStyle='#1b5e20';
  [-8,-2,5,11].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,20);ctx.lineTo(cx-2,27);ctx.lineTo(cx+4,21);ctx.fill();});
  ctx.restore();

  ctx.restore(); // unscale 1.8x

  // ── Speech bubble ──
  const bubbleText = boss.speechBubble ? 'You made it, huh?' : boss.frustratedBubble ? 'GRRRR!! NO FAIR!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 60;
    const bw = 200, bh = 46;
    ctx.save();
    ctx.fillStyle = 'white';
    ctx.strokeStyle = boss.frustratedBubble ? '#c62828' : '#333';
    ctx.lineWidth = 3;
    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', boss.frustratedBubble ? '#c62828' : '#333');
    // Tail pointing toward boss head
    const tailX = b.facing > 0 ? bubX - 1 : bubX + bw + 1;
    ctx.beginPath();
    ctx.moveTo(tailX, bubY + bh*0.6);
    ctx.lineTo(tailX + (b.facing > 0 ? -18 : 18), bubY + bh*0.8);
    ctx.lineTo(tailX, bubY + bh*0.9);
    ctx.fillStyle = 'white'; ctx.fill();
    ctx.strokeStyle = boss.frustratedBubble ? '#c62828' : '#333'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = boss.frustratedBubble ? '#c62828' : '#222';
    ctx.font = `bold ${boss.frustratedBubble ? 15 : 14}px Comic Sans MS`;
    ctx.textAlign = 'center';
    ctx.fillText(bubbleText, bubX + bw/2, bubY + bh/2 + 6);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  ctx.restore();
}

// ── Draw: Allosaurus Boss ─────────────────────────────────
function drawAllosaurus(b) {
  if (!b || b.hp<=0) return;
  const sx = b.x - cameraX;
  if (sx+b.w < -20 || sx > W+20) return;
  if (b.invincible>0 && b.state!=='defeated' && Math.floor(b.invincible/5)%2===0) return;

  ctx.save();
  ctx.translate(sx + b.w/2, b.y + b.h*0.55);
  ctx.scale(b.facing, 1);

  const breathe  = Math.sin(Date.now()/400)*1.5;
  const legSwing = Math.sin(b.frame*1.6)*9;
  const tailWag  = Math.sin(b.frame*1.2)*5;
  const defeated = b.state === 'defeated';
  const clawing  = b.state === 'claw';
  // Claw swing angle: sweeps from raised (-1.2) to slashing (0.4)
  const clawPhase = clawing ? Math.min(1, (40 - b.stateTimer) / 18) : 0;
  const clawAngle = clawing ? -1.2 + clawPhase * 1.6 : -0.3;

  ctx.scale(2.2, 2.2);

  // ── Tail ──
  ctx.beginPath();
  ctx.moveTo(-18, 20+breathe);
  ctx.bezierCurveTo(-42+tailWag,26,-64+tailWag*1.5,28,-80+tailWag*2,22);
  ctx.bezierCurveTo(-68,14,-42,14,-18,12);
  ctx.fillStyle='#7a3e00'; ctx.fill();

  // ── Body ──
  ctx.beginPath(); ctx.ellipse(6,16+breathe,31,19,0,0,Math.PI*2);
  ctx.fillStyle='#a0522d'; ctx.fill(); ctx.strokeStyle='#7a3e00'; ctx.lineWidth=2; ctx.stroke();
  // Belly
  ctx.beginPath(); ctx.ellipse(4,22+breathe,20,12,0.1,0,Math.PI*2);
  ctx.fillStyle='#f5cba7'; ctx.fill();
  // Stripe pattern
  ctx.strokeStyle='rgba(60,20,0,0.35)'; ctx.lineWidth=2;
  [-10,0,10,20].forEach(rx=>{
    ctx.beginPath(); ctx.moveTo(rx,4+breathe); ctx.lineTo(rx-4,30+breathe); ctx.stroke();
  });

  // ── Neck ──
  ctx.beginPath(); ctx.moveTo(22,4+breathe);
  ctx.bezierCurveTo(34,-2,40,-6,46,-12);
  ctx.bezierCurveTo(42,-4,36,2,28,12+breathe);
  ctx.fillStyle='#a0522d'; ctx.fill();

  // ── Head ──
  ctx.beginPath(); ctx.ellipse(52,-18,17,13,-0.1,0,Math.PI*2);
  ctx.fillStyle='#a0522d'; ctx.fill(); ctx.strokeStyle='#7a3e00'; ctx.lineWidth=2; ctx.stroke();
  // Snout (longer than Carno, narrower than T-Rex)
  ctx.beginPath();
  ctx.moveTo(38,-14); ctx.bezierCurveTo(56,-14,80,-16,92,-15);
  ctx.bezierCurveTo(92,-10,80,-9,56,-9); ctx.lineTo(38,-9); ctx.closePath();
  ctx.fillStyle='#b5631e'; ctx.fill(); ctx.strokeStyle='#7a3e00'; ctx.lineWidth=1.5; ctx.stroke();
  // Lower jaw
  ctx.beginPath();
  ctx.moveTo(40,-9); ctx.bezierCurveTo(58,-8,80,-8,92,-12);
  ctx.bezierCurveTo(92,-5,78,-3,58,-3); ctx.lineTo(40,-4); ctx.closePath();
  ctx.fillStyle='#a0522d'; ctx.fill();
  // Teeth
  ctx.fillStyle='#fffff0';
  for(let i=0;i<5;i++){
    ctx.beginPath(); ctx.moveTo(46+i*9,-9); ctx.lineTo(48+i*9,-15); ctx.lineTo(51+i*9,-9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(47+i*9,-4); ctx.lineTo(49+i*9,2);  ctx.lineTo(52+i*9,-4);  ctx.fill();
  }
  // Bony ridge above eye
  ctx.beginPath(); ctx.moveTo(38,-26); ctx.bezierCurveTo(48,-30,58,-30,66,-26);
  ctx.strokeStyle='#5c3000'; ctx.lineWidth=3; ctx.stroke();
  // Eye
  ctx.beginPath(); ctx.arc(50,-22,6,0,Math.PI*2); ctx.fillStyle='#fff9e6'; ctx.fill();
  ctx.beginPath(); ctx.arc(50,-22,4,0,Math.PI*2); ctx.fillStyle='#e65c00'; ctx.fill();
  if (defeated){
    ctx.strokeStyle='#fff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(47,-25); ctx.lineTo(53,-19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(53,-25); ctx.lineTo(47,-19); ctx.stroke();
    const st=Date.now()/200;

  ctx.translate(26, 14+breathe);

    ctx.fill(); ctx.stroke();
    ctx.restore();

  // Claw flash when actively swiping
  if (clawing && clawPhase > 0.4 && clawPhase < 0.85) {

      ctx.beginPath(); ctx.arc(cx,cy+6,5,0,Math.PI*2); ctx.fill();
    });

  ctx.restore(); // unscale

  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'NOT MY CLAWS!! ARGH!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 65;

    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', b.frustratedBubble ? '#a0522d' : '#333');

    ctx.moveTo(tailX,bubY+bh*0.6); ctx.lineTo(tailX+(b.facing>0?-18:18),bubY+bh*0.8); ctx.lineTo(tailX,bubY+bh*0.9);

    ctx.textAlign='center'; ctx.fillText(bubbleText, bubX+bw/2, bubY+bh/2+6); ctx.textAlign='left';
  }

  ctx.restore();
}
