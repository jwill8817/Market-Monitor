  for(let i=0;i<6;i++){
    ctx.beginPath(); ctx.moveTo(44+i*8,-9); ctx.lineTo(46+i*8,-15); ctx.lineTo(49+i*8,-9); ctx.fill();
    ctx.beginPath(); ctx.moveTo(45+i*8,-5); ctx.lineTo(47+i*8,1);  ctx.lineTo(50+i*8,-5); ctx.fill();
  }
  // Eye — yellow-green predator
  ctx.beginPath(); ctx.arc(48,-26,7,0,Math.PI*2); ctx.fillStyle='#f9fbe7'; ctx.fill();
  ctx.beginPath(); ctx.arc(48,-26,5,0,Math.PI*2); ctx.fillStyle='#c6ff00'; ctx.fill();
  if (defeated) {
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(44,-30); ctx.lineTo(52,-22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(52,-30); ctx.lineTo(44,-22); ctx.stroke();
    // Muddy brown steam puffs
    const st=Date.now()/200;
    ctx.fillStyle='rgba(100,70,20,0.7)';
    ctx.beginPath(); ctx.arc(44+Math.sin(st)*2,-44+Math.cos(st)*2,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(54+Math.sin(st+1)*2,-52+Math.cos(st+1)*2,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(48+Math.sin(st+2)*2,-58+Math.cos(st+2)*2,4,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(49,-26,3,0,Math.PI*2); ctx.fillStyle='#212121'; ctx.fill();
    ctx.beginPath(); ctx.arc(50,-28,1.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  }
  ctx.beginPath();
  if(defeated){ ctx.moveTo(38,-34); ctx.lineTo(60,-26); }
  else        { ctx.moveTo(40,-32); ctx.lineTo(60,-36); }
  ctx.strokeStyle='#3a2a00'; ctx.lineWidth=3; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(96,-15,3,2,0.3,0,Math.PI*2); ctx.fillStyle='#3a2a00'; ctx.fill();

  // ── Almost invisible tiny arms (even smaller than T-Rex) ──
  ctx.save(); ctx.translate(28,14+breathe); ctx.rotate(-0.6);
  ctx.beginPath(); ctx.ellipse(0,3,3,6,0,0,Math.PI*2); ctx.fillStyle='#614800'; ctx.fill();
  ctx.fillStyle='#3a2a00';
  ctx.beginPath(); ctx.moveTo(-2,7); ctx.lineTo(-3,11); ctx.lineTo(1,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2,7);  ctx.lineTo(3,11);  ctx.lineTo(5,8);  ctx.fill();
  ctx.restore();

  // ── Stocky legs ──
  ctx.save(); ctx.translate(-10,30+breathe); ctx.rotate(-legSwing*0.05);
  drawRoundRect(-7,0,18,24,7,'#3a2a00','#2c1e00');
  ctx.beginPath(); ctx.ellipse(2,26,13,5,0,0,Math.PI*2); ctx.fillStyle='#3a2a00'; ctx.fill();
  ctx.fillStyle='#2c1e00';
  [-9,-2,6,13].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,24);ctx.lineTo(cx-2,32);ctx.lineTo(cx+5,25);ctx.fill();});
  ctx.restore();

  ctx.save(); ctx.translate(12,30+breathe); ctx.rotate(legSwing*0.05);
  drawRoundRect(-7,0,18,24,7,'#4e3a00','#3a2a00');
  ctx.beginPath(); ctx.ellipse(2,26,13,5,0,0,Math.PI*2); ctx.fillStyle='#4e3a00'; ctx.fill();
  ctx.fillStyle='#3a2a00';
  [-9,-2,6,13].forEach(cx=>{ctx.beginPath();ctx.moveTo(cx,24);ctx.lineTo(cx-2,32);ctx.lineTo(cx+5,25);ctx.fill();});
  ctx.restore();

  ctx.restore(); // unscale

  const bubbleText = b.speechBubble ? b.speechText : b.frustratedBubble ? 'THE MUD... BETRAYED ME!!' : null;
  if (bubbleText) {
    const bubX = sx + (b.facing > 0 ? b.w + 10 : -220);
    const bubY = b.y - 75;
    const bw = 210, bh = 46;
    drawRoundRect(bubX, bubY, bw, bh, 10, 'white', b.frustratedBubble ? '#3e2200' : '#333');
    const tailX = b.facing > 0 ? bubX - 1 : bubX + bw + 1;
    ctx.beginPath();
    ctx.moveTo(tailX,bubY+bh*0.6); ctx.lineTo(tailX+(b.facing>0?-18:18),bubY+bh*0.8); ctx.lineTo(tailX,bubY+bh*0.9);
    ctx.fillStyle='white'; ctx.fill(); ctx.strokeStyle=b.frustratedBubble?'#3e2200':'#333'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=b.frustratedBubble?'#3e2200':'#222';
    ctx.font=`bold ${b.frustratedBubble?13:14}px Comic Sans MS`;
    ctx.textAlign='center'; ctx.fillText(bubbleText, bubX+bw/2, bubY+bh/2+6); ctx.textAlign='left';
  }

  ctx.restore();
}

// ── Draw: Regular Enemy ────────────────────────────────────
function drawEnemy(en) {
  const x = en.x-cameraX, y = en.y;
  if (x<-80||x>W+80) return;
  ctx.save();
  ctx.translate(x+22, y+22);
  ctx.scale(en.vx>0?1:-1, 1);

  drawRoundRect(-16,-10,36,32,12,'#e53935','#b71c1c');
  drawRoundRect(-6,-2,20,20,8,'#ffcdd2');
  drawRoundRect(8,-28,28,26,10,'#e53935','#b71c1c');
  ctx.beginPath(); ctx.arc(27,-18,6,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.beginPath(); ctx.arc(29,-17,3,0,Math.PI*2); ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.beginPath(); ctx.arc(30,-18,1,0,Math.PI*2); ctx.fillStyle='white'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(22,-24); ctx.lineTo(33,-27);
  ctx.strokeStyle='#b71c1c'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='white';
  for (let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(10+i*6,-2);ctx.lineTo(13+i*6,6);ctx.lineTo(16+i*6,-2);ctx.fill();}
  const ls = Math.sin(en.frame*Math.PI)*6;
  drawRoundRect(-12,20-ls,12,18,5,'#e53935');
  drawRoundRect(4,20+ls,12,18,5,'#e53935');
  drawRoundRect(-14,36,16,8,4,'#c62828');
  drawRoundRect(2,36,16,8,4,'#c62828');
  for (let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-8+i*8,-10);ctx.lineTo(-4+i*8,-22);ctx.lineTo(0+i*8,-10);ctx.fillStyle='#c62828';ctx.fill();}

  ctx.restore();
}

// ── Draw: Background ───────────────────────────────────────
function drawBackground() {
  const clouds=[{x:100,y:60},{x:320,y:40},{x:580,y:70},{x:800,y:45},{x:1050,y:65},{x:1300,y:50},{x:1550,y:75},{x:1800,y:42}];

  if (level === 2) {
    // ── Allosaurus: prehistoric forest ──
    const fGrad = ctx.createLinearGradient(0,0,0,H);
    fGrad.addColorStop(0,'#b8860b'); fGrad.addColorStop(0.5,'#8b6914'); fGrad.addColorStop(1,'#5c4a00');
    ctx.fillStyle=fGrad; ctx.fillRect(0,0,W,H);
    // Giant fern silhouettes
    ctx.fillStyle='#2d5a1b';
    [60,200,370,530,700,870,1040].forEach((tx,i)=>{
      const px2=tx-cameraX*0.4;
      if (px2>-100&&px2<W+100){
        const h=80+i%3*40;
        ctx.beginPath(); ctx.ellipse(px2,H-60-h/2,35+i%2*15,h/2,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px2-30,H-60-h*0.4,20,h*0.35,-0.4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(px2+30,H-60-h*0.4,20,h*0.35,0.4,0,Math.PI*2); ctx.fill();
      }
    });
    // Hazy amber clouds
    ctx.fillStyle='rgba(180,130,20,0.35)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,30,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+24,c.y-10,22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+48,c.y,27,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#4a3800'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 3) {
    // ── Pteranodon: stormy sky ──
    const stGrad = ctx.createLinearGradient(0,0,0,H);
    stGrad.addColorStop(0,'#1a1a2e'); stGrad.addColorStop(0.5,'#2d3561'); stGrad.addColorStop(1,'#37474f');
    ctx.fillStyle=stGrad; ctx.fillRect(0,0,W,H);
    // Storm clouds
    ctx.fillStyle='rgba(55,55,80,0.75)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,38,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+30,c.y-12,28,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+60,c.y,34,0,Math.PI*2); ctx.fill();
    });
    // Lightning flash (occasional)
    if (Math.random()<0.008) {
      ctx.save(); ctx.globalAlpha=0.18; ctx.fillStyle='#fffde7'; ctx.fillRect(0,0,W,H); ctx.restore();
    }
    // Lightning bolt silhouettes
    ctx.strokeStyle='rgba(255,245,100,0.7)'; ctx.lineWidth=2;
    [180,540,W-120].forEach(lx=>{
      const lpx=lx-(cameraX*0.2)%WORLD_W;
      if (lpx>-50&&lpx<W+50){
        ctx.beginPath(); ctx.moveTo(lpx,60); ctx.lineTo(lpx-14,130); ctx.lineTo(lpx+6,130);
        ctx.lineTo(lpx-10,210); ctx.stroke();
      }
    });
    // Rain streaks
    ctx.save(); ctx.globalAlpha=0.18; ctx.strokeStyle='#b0bec5'; ctx.lineWidth=1;
    const rt=Date.now()/40;
    for (let i=0;i<40;i++){
      const rx=((i*73+rt)%W);
      const ry=((i*47+rt*1.4)%H);
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-4,ry+14); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle='#37474f'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 6) {
    // Toxic green sky
    const tGrad = ctx.createLinearGradient(0,0,0,H);
    tGrad.addColorStop(0,'#0d2200'); tGrad.addColorStop(0.5,'#1a4400'); tGrad.addColorStop(1,'#0a1a00');
    ctx.fillStyle=tGrad; ctx.fillRect(0,0,W,H);
    // Eerie green toxic glow on ground
    const glowGrad=ctx.createLinearGradient(0,H-120,0,H);
    glowGrad.addColorStop(0,'rgba(57,255,20,0)'); glowGrad.addColorStop(1,'rgba(57,255,20,0.25)');
    ctx.fillStyle=glowGrad; ctx.fillRect(0,H-120,W,120);
    // Poison bubbles rising
    const bt=Date.now()/1000;
    ctx.fillStyle='rgba(57,255,20,0.5)';
    [60,130,220,310,400,490,590,680,770].forEach((bx2,i)=>{
      const by2=((bt*30+i*55)%H);
      ctx.beginPath(); ctx.arc(bx2+Math.sin(bt+i)*10, H-by2, 3+i%3, 0, Math.PI*2); ctx.fill();
    });
    // Dead twisted trees
    ctx.strokeStyle='#1a3300'; ctx.lineWidth=5;
    [100,320,600,900,1200].forEach((tx,i)=>{
      const px2=tx-cameraX*0.4;
      if (px2>-100&&px2<W+100) {
        ctx.beginPath(); ctx.moveTo(px2,H-60); ctx.lineTo(px2+10,H-160-i%2*40);
        ctx.lineTo(px2-20,H-230-i%2*30); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px2+10,H-200); ctx.lineTo(px2+50,H-170); ctx.stroke();
      }
    });
    ctx.fillStyle='#1a3a00'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 7) {
    // ── Irritator: lake ──
    const lkGrad = ctx.createLinearGradient(0,0,0,H);
    lkGrad.addColorStop(0,'#1a3a4a'); lkGrad.addColorStop(0.6,'#1b5e3e'); lkGrad.addColorStop(1,'#1a3a1a');
    ctx.fillStyle=lkGrad; ctx.fillRect(0,0,W,H);
    // Water shimmer at lower half
    ctx.save(); ctx.globalAlpha=0.12;
    const wt=Date.now()/800;
    for (let i=0;i<8;i++){
      ctx.fillStyle='#80cbc4';
      ctx.beginPath(); ctx.ellipse(60+i*110+Math.sin(wt+i)*20,H-80+Math.sin(wt*0.7+i)*10,40+i%3*10,6,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    // Lily pad silhouettes
    ctx.fillStyle='rgba(27,94,32,0.7)';
    [60,170,300,430,560,680,780].forEach((lx,i)=>{
      const lpx=lx-(cameraX*0.4)%WORLD_W;
      if (lpx>-60&&lpx<W+60){
        ctx.beginPath(); ctx.ellipse(lpx,H-62,18+i%3*6,7,0,0,Math.PI*2); ctx.fill();
      }
    });
    // Reed silhouettes
    ctx.fillStyle='rgba(56,142,60,0.6)';
    [100,240,390,520,660,790].forEach((rx,i)=>{
      const rpx=rx-(cameraX*0.35)%WORLD_W;
      if (rpx>-30&&rpx<W+30){
        ctx.fillRect(rpx-3,H-160-i%3*30,6,100+i%3*30);
        ctx.beginPath(); ctx.ellipse(rpx,H-160-i%3*30,10,20,-0.2,0,Math.PI*2); ctx.fill();
      }
    });
    // Ripples
    ctx.save(); ctx.globalAlpha=0.2; ctx.strokeStyle='#4db6ac'; ctx.lineWidth=1.5;
    const rpt=Date.now()/600;
    [120,300,500,700].forEach((rx,i)=>{
      const r=(rpt*30+i*40)%60;
      ctx.beginPath(); ctx.ellipse(rx,H-62,r,r*0.3,0,0,Math.PI*2); ctx.stroke();
    });
    ctx.restore();
    ctx.fillStyle='#4e342e'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 10) {
    // ── Sea level: underwater ──
    const seaGrad = ctx.createLinearGradient(0,0,0,H);
    seaGrad.addColorStop(0,'#006064'); seaGrad.addColorStop(1,'#004d40');
    ctx.fillStyle=seaGrad; ctx.fillRect(0,0,W,H);
    // Light shafts
    ctx.save(); ctx.globalAlpha=0.06;
    for (let i=0;i<6;i++){
      ctx.fillStyle='#e0f7fa';
      ctx.beginPath(); ctx.moveTo(80+i*140,0); ctx.lineTo(80+i*140+40,H); ctx.lineTo(80+i*140+80,H); ctx.lineTo(80+i*140+40,0);
      ctx.fill();
    }
    ctx.restore();
    // Bubbles
    const bt=Date.now()/1200;
    ctx.fillStyle='rgba(178,235,242,0.4)';
    [40,110,200,290,380,470,560,650,740].forEach((bx,i)=>{
      const by=((bt*40+i*60)%H);
      ctx.beginPath(); ctx.arc(bx+Math.sin(bt+i)*8,H-by,4+i%3,0,Math.PI*2); ctx.fill();
    });
    // Coral silhouettes at bottom
    ctx.fillStyle='#ff6f00';
    [50,130,250,360,480,590,700,800].forEach((cx,i)=>{
      const ch=30+i%3*15;
      ctx.beginPath(); ctx.moveTo(cx-10,H-60); ctx.lineTo(cx,H-60-ch); ctx.lineTo(cx+10,H-60); ctx.fill();
      ctx.beginPath(); ctx.arc(cx,H-60-ch,8,Math.PI,0); ctx.fill();
    });
    return;
  }

  if (level === 11) {
    // ── Neovenator: swamp ──
    const swGrad = ctx.createLinearGradient(0,0,0,H);
    swGrad.addColorStop(0,'#0d1f0d'); swGrad.addColorStop(0.6,'#1a3a1a'); swGrad.addColorStop(1,'#2d4a1e');
    ctx.fillStyle=swGrad; ctx.fillRect(0,0,W,H);
    // Gnarled tree silhouettes
    ctx.fillStyle='#1a2e10';
    [80,230,400,570,720,880].forEach((tx,i)=>{
      const tpx=tx-(cameraX*0.35)%WORLD_W;
      if (tpx>-80&&tpx<W+80){
        // Trunk
        ctx.fillRect(tpx-8,H-60-120-i%2*40,16,120+i%2*40);
        // Gnarled branches
        ctx.beginPath(); ctx.moveTo(tpx,H-160-i%2*40);
        ctx.bezierCurveTo(tpx-30,H-190-i%2*40,tpx-60,H-180-i%2*40,tpx-70,H-165-i%2*40);
        ctx.lineWidth=6; ctx.strokeStyle='#1a2e10'; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(tpx,H-150-i%2*40);
        ctx.bezierCurveTo(tpx+25,H-185-i%2*40,tpx+55,H-175-i%2*40,tpx+65,H-160-i%2*40);
        ctx.stroke();
        // Canopy blob
        ctx.beginPath(); ctx.ellipse(tpx,H-180-i%2*40,40+i%3*10,30,0,0,Math.PI*2); ctx.fill();
      }
    });
    // Thick mist at ground
    ctx.save();
    const mistGrad=ctx.createLinearGradient(0,H-120,0,H);
    mistGrad.addColorStop(0,'rgba(120,160,100,0)'); mistGrad.addColorStop(1,'rgba(120,160,100,0.35)');
    ctx.fillStyle=mistGrad; ctx.fillRect(0,H-120,W,120);
    ctx.restore();
    // Eerie glow blobs
    ctx.save(); ctx.globalAlpha=0.08;
    ctx.fillStyle='#a5d6a7';
    [150,350,550,720].forEach((gx,i)=>{
      ctx.beginPath(); ctx.arc(gx,H-80+Math.sin(Date.now()/800+i)*10,30+i%3*10,0,Math.PI*2); ctx.fill();
    });
    ctx.restore();
    // Dim clouds
    ctx.fillStyle='rgba(20,40,15,0.55)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,30,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+24,c.y-10,22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+48,c.y,27,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#2d4a1e'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 12) {
    // Dark icy Antarctic sky
    const iGrad = ctx.createLinearGradient(0,0,0,H);
    iGrad.addColorStop(0,'#071428'); iGrad.addColorStop(0.5,'#0d2040'); iGrad.addColorStop(1,'#0a1830');
    ctx.fillStyle=iGrad; ctx.fillRect(0,0,W,H);
    // Aurora bands
    const aTime=Date.now()/3000;
    ['rgba(0,255,128,0.08)','rgba(0,180,255,0.06)','rgba(160,0,255,0.05)'].forEach((col,i)=>{
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(0, 80+i*40+Math.sin(aTime+i)*20);
      for(let x=0;x<=W;x+=40) ctx.lineTo(x, 80+i*40+Math.sin(aTime+i+x/200)*25);
      ctx.lineTo(W,0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
    });
    // Falling snow
    const st2=Date.now()/800;
    ctx.fillStyle='rgba(220,240,255,0.8)';
    for(let i=0;i<30;i++){
      const sx2=((i*137+st2*40)%W);
      const sy2=((i*93+st2*60)%(H-60));
      ctx.beginPath(); ctx.arc(sx2,sy2,1.5+i%2,0,Math.PI*2); ctx.fill();
    }
    // Ice formation silhouettes
    ctx.fillStyle='#1a3050';
    [80,280,520,760,1000,1200].forEach((tx,i)=>{
      const px2=tx-cameraX*0.4;
      if(px2>-60&&px2<W+60){
        const h2=40+i%3*25;
        ctx.beginPath(); ctx.moveTo(px2-20,H-60); ctx.lineTo(px2,H-60-h2); ctx.lineTo(px2+20,H-60); ctx.fill();
      }
    });
    ctx.fillStyle='#1a2a3a'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 13) {
    // Dark cave
    ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,W,H);
    // Glowing crystal clusters
    const gt=Date.now()/2000;
    [['#7c4dff',60,380],['#00e5ff',180,400],['#76ff03',340,390],['#ff6d00',520,395],
     ['#7c4dff',700,385],['#00e5ff',860,400],['#76ff03',1050,388]].forEach(([col,cx,cy])=>{
      const gx=cx-cameraX*0.3;
      if(gx>-60&&gx<W+60){
        ctx.save(); ctx.globalAlpha=0.55+Math.sin(gt+cx/100)*0.2;
        ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=18;
        ctx.beginPath(); ctx.moveTo(gx,cy); ctx.lineTo(gx-8,cy+30); ctx.lineTo(gx+8,cy+30); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(gx+14,cy+5); ctx.lineTo(gx+7,cy+28); ctx.lineTo(gx+20,cy+28); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    });
    // Stalactites from ceiling
    ctx.fillStyle='#1a1a2e';
    [40,110,200,310,420,530,640,750,860,970,1080,1190].forEach((sx2,i)=>{
      const px2=sx2-cameraX*0.2;
      if(px2>-30&&px2<W+30){
        const sh=30+i%4*18;
        ctx.beginPath(); ctx.moveTo(px2-12,0); ctx.lineTo(px2,sh); ctx.lineTo(px2+12,0); ctx.fill();
      }
    });
    // Dim ambient glow
    const ag=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,300);
    ag.addColorStop(0,'rgba(100,50,200,0.08)'); ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 14) {
    const tzGrad=ctx.createLinearGradient(0,0,0,H);
    tzGrad.addColorStop(0,'#0d0d2e'); tzGrad.addColorStop(0.5,'#1a0a3e'); tzGrad.addColorStop(1,'#0a0020');
    ctx.fillStyle=tzGrad; ctx.fillRect(0,0,W,H);
    // Bioluminescent particles
    const bt=Date.now()/1500;
    ['#00e5ff','#7c4dff','#76ff03','#ff4081'].forEach((col,ci)=>{
      ctx.fillStyle=col;
      for(let i=0;i<8;i++){
        ctx.save(); ctx.globalAlpha=0.4+Math.sin(bt+ci*2+i)*0.3;
        const bx2=((i*180+ci*50+bt*15)%W), by2=50+((i*90+ci*30+bt*20)%(H-100));
        ctx.beginPath(); ctx.arc(bx2,by2,3+i%3,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    });
    // Eerie depth rays
    ctx.save(); ctx.globalAlpha=0.05;
    for(let i=0;i<5;i++){
      ctx.fillStyle='#7c4dff';
      ctx.beginPath(); ctx.moveTo(80+i*150,0); ctx.lineTo(60+i*150,H); ctx.lineTo(110+i*150,H); ctx.lineTo(130+i*150,0); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle='#0d0d2e'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 15) {
    const rcGrad=ctx.createLinearGradient(0,0,0,H);
    rcGrad.addColorStop(0,'#bf360c'); rcGrad.addColorStop(0.4,'#e64a19'); rcGrad.addColorStop(1,'#795548');
    ctx.fillStyle=rcGrad; ctx.fillRect(0,0,W,H);
    // Distant cliff silhouettes
    ctx.fillStyle='#4e342e';
    [[-80,H-220,160,160],[100,H-280,120,220],[280,H-200,180,140],[500,H-260,140,200],[720,H-190,200,130],[960,H-250,160,190],[1150,H-210,140,150]].forEach(([rx,ry,rw,rh])=>{
      const rpx=rx-cameraX*0.25;
      if(rpx>-200&&rpx<W+200) ctx.fillRect(rpx,ry,rw,rh);
    });
    // Distant mountains (parallax)
    ctx.fillStyle='#6d4c41';
    [50,250,480,710,940,1160].forEach((mx,i)=>{
      const mpx=mx-cameraX*0.15;
      if(mpx>-100&&mpx<W+100){const mh=80+i%3*40; ctx.beginPath();ctx.moveTo(mpx-60,H-60);ctx.lineTo(mpx,H-60-mh);ctx.lineTo(mpx+60,H-60);ctx.fill();}
    });
    // Dust particles
    if(Math.random()<0.2) spawnParticles(Math.random()*W+cameraX,H-80,'#a0785a',2);
    ctx.fillStyle='#5d4037'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 16) {
    const mudGrad=ctx.createLinearGradient(0,0,0,H);
    mudGrad.addColorStop(0,'#1a0f00'); mudGrad.addColorStop(0.5,'#2e1a00'); mudGrad.addColorStop(1,'#3e2200');
    ctx.fillStyle=mudGrad; ctx.fillRect(0,0,W,H);
    // Mud bubble pops
    const mt=Date.now()/800;
    ctx.strokeStyle='rgba(100,60,20,0.6)'; ctx.lineWidth=2;
    [80,200,350,500,650,800].forEach((bx2,i)=>{
      const phase=(mt+i*0.8)%3;
      if(phase<1.5){
        const r=phase*12;
        ctx.beginPath(); ctx.arc(bx2,H-66,r,Math.PI,0); ctx.stroke();
      }
    });
    // Heavy overcast clouds
    ctx.fillStyle='rgba(40,20,5,0.7)';
    [{x:60,y:55},{x:240,y:38},{x:450,y:52},{x:660,y:35},{x:870,y:50},{x:1070,y:40}].forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath();ctx.arc(cx,c.y,34,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+26,c.y-10,24,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+52,c.y,30,0,Math.PI*2);ctx.fill();
    });
    // Mud splats on ground
    if(Math.random()<0.04) spawnParticles(Math.random()*W+cameraX,H-60,'#6d4c41',3);
    ctx.fillStyle='#3e2200'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 17) {
    // ── Volcanic/Carno level ──
    const vGrad = ctx.createLinearGradient(0,0,0,H);
    vGrad.addColorStop(0,'#3e1a00'); vGrad.addColorStop(0.6,'#bf360c'); vGrad.addColorStop(1,'#e64a19');
    ctx.fillStyle=vGrad; ctx.fillRect(0,0,W,H);
    // Lava glow at ground
    const lavaGrad=ctx.createLinearGradient(0,H-80,0,H);
    lavaGrad.addColorStop(0,'rgba(255,87,34,0)'); lavaGrad.addColorStop(1,'rgba(255,87,34,0.5)');
    ctx.fillStyle=lavaGrad; ctx.fillRect(0,H-80,W,80);
    // Ash clouds
    ctx.fillStyle='rgba(80,40,20,0.5)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,28,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+22,c.y-8,20,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+44,c.y,25,0,Math.PI*2); ctx.fill();
    });
    // Volcanoes
    ctx.fillStyle='#3e2723';
    [150,450,800,1150].forEach(mx=>{
      const px=mx-cameraX*0.5;
      if (px>-200&&px<W+200){ctx.beginPath();ctx.moveTo(px-90,H-60);ctx.lineTo(px,H-220);ctx.lineTo(px+90,H-60);ctx.fill();}
    });
    // Ember particles
    if (Math.random()<0.3) spawnParticles(Math.random()*W+cameraX, H-60, '#ff5722', 2);
    ctx.fillStyle='#4e342e'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 18) {
    // ── Mountain Summit / Yantuanosaurus ──
    const mtGrad = ctx.createLinearGradient(0,0,0,H);
    mtGrad.addColorStop(0,'#1a2a3e'); mtGrad.addColorStop(0.5,'#2e3f5c'); mtGrad.addColorStop(1,'#3a4a6a');
    ctx.fillStyle=mtGrad; ctx.fillRect(0,0,W,H);
    // Distant snowy peaks
    ctx.fillStyle='#546e7a';
    [[-60,H-300,140],[80,H-360,120],[220,H-310,160],[400,H-380,140],[560,H-330,180],[730,H-370,150],[900,H-320,160],[1060,H-355,130]].forEach(([mx,my,mw])=>{
      const mpx=mx-cameraX*0.18;
      if(mpx>-200&&mpx<W+200){
        ctx.beginPath(); ctx.moveTo(mpx,H-60); ctx.lineTo(mpx+mw/2,my); ctx.lineTo(mpx+mw,H-60); ctx.fill();
      }
    });
    // Snow caps on peaks
    ctx.fillStyle='#eceff1';
    [[-60,H-300,140],[80,H-360,120],[220,H-310,160],[400,H-380,140],[560,H-330,180],[730,H-370,150],[900,H-320,160],[1060,H-355,130]].forEach(([mx,my,mw])=>{
      const mpx=mx-cameraX*0.18;
      if(mpx>-200&&mpx<W+200){
        const cx=mpx+mw/2, snapH=Math.max(20,mw*0.25);
        ctx.beginPath(); ctx.moveTo(cx,my); ctx.lineTo(cx-snapH*0.8,my+snapH); ctx.lineTo(cx+snapH*0.8,my+snapH); ctx.fill();
      }
    });
    // Thin clouds at altitude
    ctx.fillStyle='rgba(200,220,240,0.3)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.25)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,22,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+18,c.y-6,16,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+36,c.y,20,0,Math.PI*2); ctx.fill();
    });
    // Blowing snow streaks
    ctx.save(); ctx.globalAlpha=0.12; ctx.strokeStyle='#fff'; ctx.lineWidth=1;
    const st=Date.now()/60;
    for(let i=0;i<30;i++){const sx=((i*83+st)%W),sy=((i*51+st*0.6)%(H*0.7));ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+12,sy+4);ctx.stroke();}
    ctx.restore();
    ctx.fillStyle='#546e7a'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 19) {
    // ── Underground Lair / Megalosaurus ──
    const ugGrad = ctx.createLinearGradient(0,0,0,H);
    ugGrad.addColorStop(0,'#0a0a0a'); ugGrad.addColorStop(0.5,'#1a1410'); ugGrad.addColorStop(1,'#2a2010');
    ctx.fillStyle=ugGrad; ctx.fillRect(0,0,W,H);
    // Stalactites hanging from ceiling
    ctx.fillStyle='#2d2d2d';
    [30,110,200,300,390,480,570,660,750].forEach((sx2,i)=>{
      const spx=sx2-(cameraX*0.4)%WORLD_W;
      if(spx>-40&&spx<W+40){
        const sh=40+i%3*25;
        ctx.beginPath(); ctx.moveTo(spx-12,0); ctx.lineTo(spx+12,0); ctx.lineTo(spx,sh); ctx.fill();
        // drip highlight
        ctx.fillStyle='rgba(100,80,40,0.4)';
        ctx.beginPath(); ctx.arc(spx,sh,4,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#2d2d2d';
      }
    });
    // Stalagmites rising from floor
    ctx.fillStyle='#333';
    [60,160,260,360,460,560,680,780].forEach((sx2,i)=>{
      const spx=sx2-(cameraX*0.4)%WORLD_W;
      if(spx>-40&&spx<W+40){
        const sh=20+i%3*15;
        ctx.beginPath(); ctx.moveTo(spx-8,H-60); ctx.lineTo(spx+8,H-60); ctx.lineTo(spx,H-60-sh); ctx.fill();
      }
    });
    // Glowing lava cracks in walls
    ctx.save(); ctx.globalAlpha=0.15;
    ctx.strokeStyle='#ff6f00'; ctx.lineWidth=3;
    [80,250,420,610,750].forEach(lx=>{
      const lpx=lx-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.moveTo(lpx,H*0.1); ctx.lineTo(lpx+20,H*0.3); ctx.lineTo(lpx-10,H*0.5); ctx.stroke();
    });
    ctx.restore();
    // Eerie torch glow spots
    ctx.save(); ctx.globalAlpha=0.08;
    [120,350,580,810].forEach(tx=>{
      const tpx=tx-(cameraX*0.3)%WORLD_W;
      const tg=ctx.createRadialGradient(tpx,H*0.4,0,tpx,H*0.4,80);
      tg.addColorStop(0,'#ff8f00'); tg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=tg; ctx.fillRect(tpx-80,H*0.2,160,200);
    });
    ctx.restore();
    // Dripping water particles
    if(Math.random()<0.08) spawnParticles(Math.random()*W+cameraX,0,'rgba(80,120,160,0.7)',1);
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 20) {
    // ── Dark jungle / T-Rex ──
    const jGrad=ctx.createLinearGradient(0,0,0,H);
    jGrad.addColorStop(0,'#1a2e0a'); jGrad.addColorStop(1,'#2e4a1a');
    ctx.fillStyle=jGrad; ctx.fillRect(0,0,W,H);
    // Foliage silhouettes
    ctx.fillStyle='#1b5e20';
    [0,100,220,350,490,620,750,W].forEach((tx,i)=>{
      const ph=60+i%4*30;
      ctx.beginPath(); ctx.ellipse(tx,H-60-ph/2,50+i%3*20,ph/2,0,0,Math.PI*2); ctx.fill();
    });
    // Eerie mist
    ctx.save(); ctx.globalAlpha=0.12;
    const mGrad=ctx.createLinearGradient(0,H-100,0,H);
    mGrad.addColorStop(0,'rgba(200,255,200,0)'); mGrad.addColorStop(1,'rgba(200,255,200,1)');
    ctx.fillStyle=mGrad; ctx.fillRect(0,H-100,W,100);
    ctx.restore();
    // Dim clouds
    ctx.fillStyle='rgba(30,60,20,0.6)';
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,28,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+22,c.y-8,20,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+44,c.y,25,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#1b5e20'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 4) {
    const rGrad = ctx.createLinearGradient(0,0,0,H);
    rGrad.addColorStop(0,'#1a1a2e'); rGrad.addColorStop(1,'#2d3a2d');
    ctx.fillStyle=rGrad; ctx.fillRect(0,0,W,H);
    // Rain streaks
    const rt = Date.now()/100;
    ctx.strokeStyle='rgba(150,200,255,0.35)'; ctx.lineWidth=1.5;
    for(let i=0;i<50;i++){
      const rx=((i*97+rt*60)%W), ry=((i*53+rt*90)%(H+40))-40;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-4,ry+18); ctx.stroke();
    }
    // Lightning flash (rare)
    if (Math.random()<0.004) {
      ctx.fillStyle='rgba(200,220,255,0.15)'; ctx.fillRect(0,0,W,H);
    }
    // Dark storm clouds
    ctx.fillStyle='rgba(30,30,50,0.7)';
    const clouds=[{x:60,y:50},{x:250,y:35},{x:460,y:55},{x:650,y:30},{x:860,y:50},{x:1050,y:38}];
    clouds.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,36,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+28,c.y-10,26,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+56,c.y,32,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#2d3a2d'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 8) {
    const slGrad = ctx.createLinearGradient(0,0,0,H);
    slGrad.addColorStop(0,'#0d1f2d'); slGrad.addColorStop(0.6,'#1a3040'); slGrad.addColorStop(1,'#0d2030');
    ctx.fillStyle=slGrad; ctx.fillRect(0,0,W,H);
    // Heavy rain
    const rt2=Date.now()/90;
    ctx.strokeStyle='rgba(100,160,220,0.4)'; ctx.lineWidth=1.5;
    for(let i=0;i<60;i++){
      const rx=((i*89+rt2*70)%W), ry=((i*61+rt2*100)%(H+40))-40;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-5,ry+20); ctx.stroke();
    }
    // Lightning
    if (Math.random()<0.005) { ctx.fillStyle='rgba(180,210,255,0.12)'; ctx.fillRect(0,0,W,H); }
    // Water surface shimmer at ground level
    ctx.save(); ctx.globalAlpha=0.18;
    ctx.fillStyle='#4fc3f7';
    ctx.fillRect(0,H-64,W,8);
    ctx.restore();
    // Storm clouds
    ctx.fillStyle='rgba(20,35,50,0.75)';
    const clouds2=[{x:80,y:45},{x:270,y:30},{x:480,y:50},{x:680,y:28},{x:880,y:48},{x:1080,y:35}];
    clouds2.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,38,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+30,c.y-12,27,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+60,c.y,34,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#1a3040'; ctx.fillRect(0,H-64,W,8);
    return;
  }

  if (level === 9) {
    const brGrad = ctx.createLinearGradient(0,0,0,H);
    brGrad.addColorStop(0,'#0d1a0d'); brGrad.addColorStop(0.5,'#1a2e1a'); brGrad.addColorStop(1,'#0d200d');
    ctx.fillStyle=brGrad; ctx.fillRect(0,0,W,H);
    // River rain streaks (diagonal)
    const rt3=Date.now()/80;
    ctx.strokeStyle='rgba(100,180,100,0.3)'; ctx.lineWidth=1.5;
    for(let i=0;i<55;i++){
      const rx=((i*83+rt3*65)%W), ry=((i*57+rt3*95)%(H+40))-40;
      ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-6,ry+22); ctx.stroke();
    }
    // Lightning flash
    if (Math.random()<0.005) { ctx.fillStyle='rgba(180,255,180,0.1)'; ctx.fillRect(0,0,W,H); }
    // Rushing river ripples at ground
    const wt=Date.now()/600;
    ctx.strokeStyle='rgba(100,200,100,0.25)'; ctx.lineWidth=2;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      for(let x=0;x<W;x+=40) ctx.lineTo(x, H-64+Math.sin(wt+x/80+i)*4);
      ctx.stroke();
    }
    // Dark rain clouds
    ctx.fillStyle='rgba(15,30,15,0.7)';
    const clouds3=[{x:70,y:40},{x:260,y:28},{x:470,y:45},{x:670,y:25},{x:870,y:42},{x:1060,y:32}];
    clouds3.forEach(c=>{
      const cx=c.x-(cameraX*0.3)%WORLD_W;
      ctx.beginPath(); ctx.arc(cx,c.y,35,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+27,c.y-11,25,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+54,c.y,31,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle='#1a2e1a'; ctx.fillRect(0,H-64,W,8);
    return;
  }
  // ── Normal sky (level 1 only) ──
  ctx.fillStyle='rgba(255,255,255,0.85)';
  clouds.forEach(c=>{
    const cx=c.x-(cameraX*0.3)%WORLD_W;
    ctx.beginPath(); ctx.arc(cx,c.y,28,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+22,c.y-8,20,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+44,c.y,25,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle='#a5d6a7';
  [150,380,620,900,1150,1400,1650,1900,2150].forEach(mx=>{
    const px=mx-cameraX*0.5;
    if (px>-200&&px<W+200){ctx.beginPath();ctx.moveTo(px-80,H-60);ctx.lineTo(px,H-200);ctx.lineTo(px+80,H-60);ctx.fill();}
  });
  ctx.fillStyle='#8bc34a';
  ctx.fillRect(0,H-64,W,8);
}

function drawPlatform(p) {
  const px=p.x-cameraX;
  if (px+p.w<0||px>W) return;
  const themes = {
    1:  { ground:'#5d8a2a', top:'#8bc34a', tuft:'#558b2f' },
    2:  { ground:'#4a3800', top:'#7a6010', tuft:'#3a2c00' },
    3:  { ground:'#37474f', top:'#546e7a', tuft:'#263238' },
    4:  { ground:'#2d3a2d', top:'#546e7a', tuft:'#1a2a1a' },
    5:  { ground:'#4e342e', top:'#6d4c41', tuft:'#3e2723' },
    6:  { ground:'#1a3a00', top:'#4a7a00', tuft:'#0d2200' },
    7:  { ground:'#1a3a1a', top:'#388e3c', tuft:'#1b5e20' },
    8:  { ground:'#1a2e3a', top:'#37474f', tuft:'#0d1f2d' },
    9:  { ground:'#1a2a1e', top:'#4caf50', tuft:'#0d1a10' },
    10: { ground:'#004d40', top:'#ff6f00', tuft:'#e65100' },
    11: { ground:'#2d4a1e', top:'#4a7c3f', tuft:'#1a3a10' },
    12: { ground:'#1a2a3a', top:'#78bfd8', tuft:'#0d1a2a' },
    13: { ground:'#1a1a2e', top:'#4a148c', tuft:'#0d0d1e' },
    14: { ground:'#0d0d2e', top:'#1565c0', tuft:'#050520' },
    15: { ground:'#3e2723', top:'#795548', tuft:'#2e1a12' },
    16: { ground:'#3e2200', top:'#5d4037', tuft:'#2e1800' },
    17: { ground:'#3e2723', top:'#bf360c', tuft:'#8d1b00' },
    18: { ground:'#546e7a', top:'#b0bec5', tuft:'#37474f' },
    19: { ground:'#1a1a1a', top:'#424242', tuft:'#0d0d0d' },
    20: { ground:'#1b5e20', top:'#2e7d32', tuft:'#1a3a1a' },
  };
  const th = themes[level] || themes[1];
  if (p.h>30) {
    ctx.fillStyle=th.ground; ctx.fillRect(px,p.y,p.w,p.h);
    ctx.fillStyle=th.top;    ctx.fillRect(px,p.y,p.w,14);
    ctx.fillStyle=th.tuft;
    if (level===10) {
      // Coral tufts
      for (let i=6;i<p.w-6;i+=16){
        ctx.beginPath(); ctx.arc(px+i,p.y,5,Math.PI,0); ctx.fill();
        ctx.beginPath(); ctx.arc(px+i+6,p.y-4,3,Math.PI,0); ctx.fill();
      }
    } else if (level===17) {
      // Lava cracks
      ctx.strokeStyle='#ff5722'; ctx.lineWidth=2;
      for (let i=8;i<p.w-8;i+=20){
        ctx.beginPath(); ctx.moveTo(px+i,p.y+2); ctx.lineTo(px+i+6,p.y+10); ctx.lineTo(px+i+12,p.y+4); ctx.stroke();
      }
    } else {
      for (let i=4;i<p.w-4;i+=14){ctx.beginPath();ctx.arc(px+i,p.y+2,4,Math.PI,0);ctx.fill();}
    }
  } else {
    drawRoundRect(px,p.y,p.w,p.h,8,th.top,th.tuft);
    ctx.fillStyle=th.top; ctx.fillRect(px+4,p.y+2,p.w-8,6);
    if (level===10) {
      // Coral decoration on floating platforms
      ctx.fillStyle=th.tuft;
      ctx.beginPath(); ctx.arc(px+10,p.y,5,Math.PI,0); ctx.fill();
      ctx.beginPath(); ctx.arc(px+p.w-10,p.y,5,Math.PI,0); ctx.fill();
    }
  }
}

// ── Draw: Boss Health Bar ──────────────────────────────────
function drawBossHUD() {
  if (!boss||boss.hp<=0) return;
  const bw=280, bh=22, bx=(W-bw)/2, by=12;
  ctx.fillStyle='rgba(0,0,0,0.55)';
  drawRoundRect(bx-4,by-4,bw+8,bh+8,8,'rgba(0,0,0,0.55)');
  ctx.fillStyle='#b71c1c';
  drawRoundRect(bx,by,bw,bh,6,'#4a0000');
  const pct = boss.hp/boss.maxHp;
  const barColor = pct>0.6?'#4caf50':pct>0.3?'#ff9800':'#f44336';
  drawRoundRect(bx,by,bw*pct,bh,6,barColor);
  // Pulse when low
  if (pct<=0.3) {
    ctx.globalAlpha=0.3+Math.sin(Date.now()/120)*0.3;
    drawRoundRect(bx,by,bw*pct,bh,6,'#ffeb3b');
    ctx.globalAlpha=1;
  }
  const bossNames = {
    2:'🦴 ALLOSAURUS',       3:'🦅 PTERANODON',        4:'🌧️ DIMORPHODON',
    5:'🦕 SPINOSAURUS',      6:'☠️ CERATOSAURUS',      7:'🐊 IRRITATOR',
    8:'⛈️ SUCHOMIMUS',       9:'🌊 BARYONYX',          10:'🌊 MOSASAURUS',
    11:'🌿 NEOVENATOR',      12:'❄️ CRYOLOPHOSAURUS',  13:'🦇 ALBERTOSAURUS',
    14:'🌌 KRONOSAURUS',     15:'🏔️ GIGANOTOSAURUS',   16:'🟤 TARBOSAURUS',
    17:'🌋 CARNOTAURUS',     18:'🏔️ YANTUANOSAURUS',      19:'🪨 MEGALOSAURUS',        20:'🦖 T-REX — FINAL BOSS'
  };
  ctx.fillStyle='#fff'; ctx.font='bold 13px Comic Sans MS';
  ctx.textAlign='center'; ctx.fillText(bossNames[level]||'BOSS', W/2, by+bh-5);
  ctx.textAlign='left';
}

// ── Draw: Egg ──────────────────────────────────────────────
function drawEgg(x, y, w, h, color, bobY) {
  ctx.save(); ctx.translate(x+w/2, bobY+h/2);
  ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-4,-6,4,6,-0.4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fill();
  ctx.beginPath(); ctx.arc(4,4,3,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fill();
  ctx.restore();
}

// ── Draw: Boss Projectile ──────────────────────────────────
function drawBossProjectile(pb) {
  const px=pb.x-cameraX, py=pb.y;
  ctx.save();
  ctx.globalAlpha=pb.life;
  if (pb.color) {
    // Boulder / rock projectile
    ctx.fillStyle=pb.color;
    ctx.beginPath(); ctx.arc(px,py,pb.size,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#455a64'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.arc(px-pb.size*0.3,py-pb.size*0.3,pb.size*0.3,0,Math.PI*2); ctx.fill();
  } else {
    const g=ctx.createRadialGradient(px,py,0,px,py,pb.size);
    g.addColorStop(0,'#80deea'); g.addColorStop(0.6,'#00acc1'); g.addColorStop(1,'rgba(0,150,180,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(px,py,pb.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}

// ── Main Draw ──────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,W,H);
  drawBackground();
  platforms.forEach(drawPlatform);

  const t=Date.now()/600;
  eggs.forEach(egg=>{
    if (egg.collected) return;
    const px=egg.x-cameraX;
    if (px<-40||px>W+40) return;
    const bobY=egg.y+Math.sin(t+egg.bobOffset)*4;
    drawEgg(px,egg.y,egg.w,egg.h,egg.color,bobY);
    if (Math.random()<0.04) spawnParticles(egg.x+12,egg.y,'rgba(255,255,150,0.8)',2);
  });

  enemies.forEach(drawEnemy);
  if (boss) {
    if      (level===2)  drawAllosaurus(boss);
    else if (level===3)  drawPteranodon(boss);
    else if (level===4)  drawDimorphodon(boss);
    else if (level===5)  drawSpinoBoss(boss);
    else if (level===6)  drawCeratosaurus(boss);
    else if (level===7)  drawIrritator(boss);
    else if (level===8)  drawSuchomimus(boss);
    else if (level===9)  drawBaryonyx(boss);
    else if (level===10) drawMosasaurus(boss);
    else if (level===11) drawNeovenator(boss);
    else if (level===12) drawCryolophosaurus(boss);
    else if (level===13) drawAlbertosaurus(boss);
    else if (level===14) drawKronosaurus(boss);
    else if (level===15) drawGiganotosaurus(boss);
    else if (level===16) drawTarbosaurus(boss);
    else if (level===17) drawCarnotaurus(boss);
    else if (level===18) drawYantuanosaurus(boss);
    else if (level===19) drawMegalosaurus(boss);
    else if (level===20) drawTRex(boss);
  }
  bossProjectiles.forEach(drawBossProjectile);
  // Shockwaves (T-Rex roar)
  ctx.save();
  for (const sw of bossShockwaves) {
    ctx.globalAlpha = sw.life * 0.7;
    ctx.strokeStyle = '#ffe082'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(sw.x-cameraX, sw.y, sw.radius, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sw.x-cameraX, sw.y, sw.radius+8, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();

  if (state==='playing'||state==='dead')
    drawIggy(player.x-cameraX, player.y, player.facing, player.frame, player.invincible);

  // Particles
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x-cameraX,p.y,p.size/2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Finish flag (non-boss levels)
  if (level<2) {
    const fx=WORLD_W-120-cameraX;
    if (fx>-40&&fx<W+40) {
      ctx.fillStyle='#795548'; ctx.fillRect(fx,H-240,8,180);
      ctx.fillStyle='#ff9800';
      ctx.beginPath(); ctx.moveTo(fx+8,H-240); ctx.lineTo(fx+60,H-220); ctx.lineTo(fx+8,H-200); ctx.fill();
      ctx.fillStyle='white'; ctx.font='bold 15px Comic Sans MS'; ctx.fillText('🥚 Finish!',fx-8,H-182);
    }
  }

  drawBossHUD();

  // ── Easy mode badge ──
  if (easyMode && (state==='playing' || state==='win')) {
    ctx.save();
    ctx.fillStyle='rgba(255,152,0,0.88)';
    drawRoundRect(8, 8, 130, 32, 8, 'rgba(255,152,0,0.88)');
    ctx.fillStyle='white';
    ctx.font='bold 16px Comic Sans MS';
    ctx.textAlign='left';
    ctx.fillText('⭐ EASY MODE', 18, 29);
    ctx.restore();
  }

  // ── Pause overlay ──
  if (paused) {
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.52)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='white';
    ctx.font='bold 48px Comic Sans MS';
    ctx.textAlign='center';
    ctx.fillText('⏸ PAUSED', W/2, H/2-20);
    ctx.font='bold 20px Comic Sans MS';
    ctx.fillText('Press P to resume', W/2, H/2+24);
    ctx.textAlign='left';
    ctx.restore();
  }
}

// ── Game Loop ──────────────────────────────────────────────
function loop(ts) {
  update(ts);
  draw();
  requestAnimationFrame(loop);
}

// ── UI ─────────────────────────────────────────────────────
function showMessage(title, body, btnText, showEasyBtn=false, showLvlBtn=false) {
  document.getElementById('msg-title').textContent=title;
  document.getElementById('msg-body').innerHTML=body.replace(/\n/g,'<br>');
  document.getElementById('msg-btn').textContent=btnText;
  document.getElementById('easy-btn').style.display = showEasyBtn ? 'inline-block' : 'none';
  document.getElementById('lvl-select-btn').style.display = showLvlBtn ? 'inline-block' : 'none';
  document.getElementById('message').style.display='block';
}
function hideMessage() { document.getElementById('message').style.display='none'; }

function startGame(easy=false) {
  easyMode = easy;
  document.getElementById('message').style.display='none';
  document.getElementById('level-select').style.display='none';
  score=0; lives=3; level=1;
  document.getElementById('score').textContent='0';
  document.getElementById('lives').textContent=easy ? '∞' : '3';
  document.getElementById('level').textContent='1';
  resetPlayer(); buildLevel(1); state='playing';
}

function nextLevel() {
  hideMessage();
  document.getElementById('level').textContent=level;
  resetPlayer(); buildLevel(level); state='playing';
}

document.getElementById('msg-btn').addEventListener('click', ()=>{
  if (state==='menu') startGame(false);
  else if (state==='gameover') startGame(false);
  else if (state==='win') nextLevel();
});
document.getElementById('easy-btn').addEventListener('click', ()=>{
  if (state==='menu'||state==='gameover') startGame(true);
});

// ── Level Select ───────────────────────────────────────────
const LEVEL_NAMES = {
  1:'🥚 Egg Run', 2:'🦴 Allosaurus', 3:'🦅 Pteranodon', 4:'🌧️ Dimorphodon',
  5:'🦕 Spinosaurus', 6:'☠️ Ceratosaurus', 7:'🐊 Irritator', 8:'⛈️ Suchomimus',
  9:'🌊 Baryonyx', 10:'🌊 Mosasaurus', 11:'🌿 Neovenator', 12:'❄️ Cryolophosaurus',
  13:'🦇 Albertosaurus', 14:'🌌 Kronosaurus', 15:'🏔️ Giganotosaurus',
  16:'🟤 Tarbosaurus', 17:'🌋 Carnotaurus', 18:'🏔️ Yantuanosaurus', 19:'🪨 Megalosaurus', 20:'💀 T-Rex FINAL'
};
const LEVEL_SUBS = {
  1:'Sunny Meadow', 2:'Prehistoric Forest', 3:'Stormy Sky', 4:'Rainy Sky',
  5:'Land', 6:'Toxic Swamp', 7:'Lake', 8:'Stormy Lake',
  9:'Stormy River', 10:'Sea', 11:'Swamp', 12:'Antarctic Ice',
  13:'Dark Cave', 14:'Twilight Zone', 15:'Rocky Cliffs',
  16:'Mud Pit', 17:'Volcanic Land', 18:'Mountain Summit', 19:'Underground Lair', 20:'Dark Jungle'
};

function openLevelSelect() {
  document.getElementById('message').style.display='none';
  const grid = document.getElementById('lvl-grid');
  grid.innerHTML = '';
  for (let i=1; i<=20; i++) {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    btn.innerHTML = `<span class="lvl-num">Level ${i}</span>${LEVEL_NAMES[i]||''}`;
    btn.title = LEVEL_SUBS[i]||'';
    btn.addEventListener('click', () => {
      easyMode = false;
      score=0; lives=3; level=i;
      document.getElementById('score').textContent='0';
      document.getElementById('lives').textContent='3';
      document.getElementById('level').textContent=i;
      state='playing';
      closeLevelSelect();
      resetPlayer(); buildLevel(i);
    });
    grid.appendChild(btn);
  }
  document.getElementById('level-select').style.display='block';
}
function closeLevelSelect() {
  document.getElementById('level-select').style.display='none';
  if (state==='menu') document.getElementById('message').style.display='block';
}

document.getElementById('lvl-select-btn').addEventListener('click', openLevelSelect);
document.getElementById('lvl-select-close').addEventListener('click', closeLevelSelect);

// ── Boot ───────────────────────────────────────────────────
showMessage('🦖 Iggy\'s Egg Adventure!',
  'Help Iggy the orange velociraptor collect all the eggs!\n\n' +
  '⬅️ ➡️ Arrow Keys to run  •  ⬆️ SPACE to jump\n' +
  '🥚 Collect eggs  •  👹 Stomp red dinos\n' +
  '⚠️ Defeat 10 bosses across 11 levels!\n\n' +
  '🟢 <b>Normal</b> — full challenge, 3 lives\n' +
  '⭐ <b>Easy Mode</b> — no damage, just fun!',
  "Normal Mode 🦖", true, true);

loop(0);
</script>
